name: Sync GraphBolt paper table labels

on:
  push:
    branches: [paper-deep-review-corrections-20260917]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: paper-deep-review-corrections-20260917
      - name: Update generated external-baseline table
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('paper/vldb/prepare_submission.py')
          lines = p.read_text().splitlines()
          out = []
          replaced_001 = 0
          replaced_05 = 0

          for line in lines:
              stripped = line.strip()
              if stripped.startswith('Matched dynamic BFS, 0.01') and "graphbolt['0.0001']" in line:
                  out.append(r"Matched dynamic BFS, 0.1\% operations & GraphBolt/VeloGraphX latency & {graphbolt['0.001']:.3f}$\times$ & VeloGraphX \\")
                  replaced_001 += 1
              elif stripped.startswith('Matched dynamic BFS, 0.5') and "graphbolt['0.005']" in line:
                  out.append(r"Matched dynamic BFS, 1\% operations & GraphBolt/VeloGraphX latency & {graphbolt['0.01']:.3f}$\times$ & VeloGraphX \\")
                  out.append(r"Matched dynamic BFS, 5\% operations & GraphBolt/VeloGraphX latency & {graphbolt['0.05']:.3f}$\times$ & GraphBolt \\")
                  replaced_05 += 1
              else:
                  out.append(line)

          if replaced_001 != 1 or replaced_05 != 1:
              raise SystemExit(
                  f'GraphBolt table row mismatch: 0.01-row={replaced_001}, 0.5-row={replaced_05}'
              )

          p.write_text('\n'.join(out) + '\n')
          PY
      - name: Verify corrected table source
        run: |
          grep -F "graphbolt['0.001']" paper/vldb/prepare_submission.py
          grep -F "graphbolt['0.01']" paper/vldb/prepare_submission.py
          grep -F "graphbolt['0.05']" paper/vldb/prepare_submission.py
          ! grep -F "graphbolt['0.0001']" paper/vldb/prepare_submission.py
          ! grep -F "graphbolt['0.005']" paper/vldb/prepare_submission.py
      - name: Commit correction and remove one-shot workflow
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/paper-graphbolt-build-fix.yml
          git add paper/vldb/prepare_submission.py
          git commit -m "paper: sync GraphBolt build table with corrected fractions"
          git push origin HEAD:paper-deep-review-corrections-20260917
