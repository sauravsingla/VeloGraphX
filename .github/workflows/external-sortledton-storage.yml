name: External Sortledton Storage Evidence

on:
  push:
    paths:
      - '.github/workflows/external-sortledton-storage.yml'
      - 'benchmarks/external_sortledton_storage_bfs.cpp'
      - 'include/velographx/graph_access.hpp'
      - 'include/velographx/incremental/bfs.hpp'
      - 'include/velographx/incremental/weighted_sssp.hpp'
      - 'tests/test_graph_access_adl.cpp'
  pull_request:
    paths:
      - '.github/workflows/external-sortledton-storage.yml'
      - 'benchmarks/external_sortledton_storage_bfs.cpp'
      - 'include/velographx/graph_access.hpp'
      - 'include/velographx/incremental/bfs.hpp'
      - 'include/velographx/incremental/weighted_sssp.hpp'
      - 'tests/test_graph_access_adl.cpp'
  workflow_dispatch:

jobs:
  sortledton-storage-swap:
    runs-on: ubuntu-22.04
    timeout-minutes: 75
    env:
      SORTLEDTON_SHA: 6eb638f3ad38f8a10a127e7e118528f4c8d07a6e
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libtbb-dev libnuma-dev libboost-dev

      - name: Build and test VeloGraphX abstraction contract
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DVELOGRAPHX_BUILD_TESTS=ON -DVELOGRAPHX_BUILD_BENCHMARKS=OFF
          cmake --build build --parallel 2
          ctest --test-dir build --output-on-failure

      - name: Clone pinned Sortledton
        run: |
          git clone --recursive https://gitlab.db.in.tum.de/per.fuchs/sortledton.git external/sortledton
          git -C external/sortledton checkout "$SORTLEDTON_SHA"
          git -C external/sortledton submodule update --init --recursive
          test "$(git -C external/sortledton rev-parse HEAD)" = "$SORTLEDTON_SHA"
          echo 'Pinned Sortledton layout:'
          find external/sortledton -maxdepth 2 -type f \( -name 'CMakeLists.txt' -o -name 'Makefile' -o -name 'TransactionManager.h' \) -print | sort

      - name: Discover and build Sortledton release configuration
        run: |
          set -euo pipefail
          HEADER_FILE="$(find external/sortledton -type f -path '*/data-structure/TransactionManager.h' -print -quit)"
          test -n "$HEADER_FILE"
          HEADER_ROOT="${HEADER_FILE%/data-structure/TransactionManager.h}"
          echo "SORTLEDTON_HEADER_ROOT=$HEADER_ROOT" >> "$GITHUB_ENV"

          if test -f external/sortledton/CMakeLists.txt; then
            CMAKE_SRC=external/sortledton
          else
            CMAKE_FILE="$(find external/sortledton -maxdepth 3 -type f -name CMakeLists.txt -print | sort | head -n1)"
            test -n "$CMAKE_FILE"
            CMAKE_SRC="$(dirname "$CMAKE_FILE")"
          fi
          echo "Using Sortledton CMake source: $CMAKE_SRC"
          cmake -S "$CMAKE_SRC" -B external/sortledton-build -DCMAKE_BUILD_TYPE=Release
          cmake --build external/sortledton-build --target sortledton --parallel 2

          find external/sortledton-build -type f \( -name 'libsortledton.a' -o -name 'libsortledton.so' -o -name '*.a' -o -name '*.so' \) -print | sort | tee /tmp/sortledton-libs.txt
          SORTLEDTON_LIB="$(grep -E '/libsortledton\.(a|so)$' /tmp/sortledton-libs.txt | head -n1 || true)"
          if test -z "$SORTLEDTON_LIB"; then
            SORTLEDTON_LIB="$(grep -E '\.(a|so)$' /tmp/sortledton-libs.txt | head -n1 || true)"
          fi
          test -n "$SORTLEDTON_LIB"
          echo "SORTLEDTON_LIB=$SORTLEDTON_LIB" >> "$GITHUB_ENV"

      - name: Compile same-algorithm storage benchmark
        run: |
          c++ -O3 -DNDEBUG -std=c++20 -fopenmp \
            -Iinclude \
            -I"$SORTLEDTON_HEADER_ROOT" \
            -Iexternal/sortledton \
            benchmarks/external_sortledton_storage_bfs.cpp \
            build/libvelographx.a "$SORTLEDTON_LIB" \
            -ltbb -lnuma -latomic -pthread \
            -o build/velographx_external_sortledton_storage_bfs

      - name: Run exact storage-swap and mutation campaign
        run: |
          mkdir -p artifacts/sortledton
          build/velographx_external_sortledton_storage_bfs 8192 | tee artifacts/sortledton/sortledton-8192.json
          build/velographx_external_sortledton_storage_bfs 32768 | tee artifacts/sortledton/sortledton-32768.json

      - name: Validate result contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          rows = []
          for path in sorted(Path('artifacts/sortledton').glob('sortledton-*.json')):
              text = path.read_text().strip()
              assert text, f'empty result file: {path}'
              row = json.loads(text)
              rows.append(row)
              assert row['schema_version'] == 2
              assert row['benchmark'] == 'same-algorithm-storage-bfs'
              assert row['algorithm'] == 'BasicIncrementalBFS'
              assert row['dataset'] == 'synthetic'
              assert row['repetitions'] == 5
              assert row['update_count'] > 0
              assert row['recompute_exact'] is True
              assert row['update_exact'] is True
              assert row['exact'] is True
              assert row['dynamic_graph_median_us'] > 0
              assert row['csr_graph_median_us'] > 0
              assert row['sortledton_median_us'] > 0
              assert row['dynamic_update_us'] > 0
              assert row['sortledton_update_us'] > 0
          assert len(rows) == 2
          assert {row['vertices'] for row in rows} == {8192, 32768}
          PY

      - name: Record immutable experiment metadata
        run: |
          python - <<'PY'
          import json, os, platform, subprocess
          from pathlib import Path
          payload = {
              'schema_version': 2,
              'artifact_type': 'velographx-sortledton-storage-swap',
              'publication_grade': False,
              'same_algorithm': 'BasicIncrementalBFS recompute and apply',
              'sortledton_commit': os.environ['SORTLEDTON_SHA'],
              'sortledton_semantics': 'undirected simple graph; unit weights; dense vertex IDs',
              'datasets': [
                  {'kind': 'deterministic_synthetic', 'vertices': 8192},
                  {'kind': 'deterministic_synthetic', 'vertices': 32768},
              ],
              'update_semantics': 'identical 64-edge insertion batch; exact full distance-vector equality checked after apply',
              'compiler': subprocess.check_output(['c++', '--version'], text=True).splitlines()[0],
              'platform': platform.platform(),
              'runner': 'github-hosted ubuntu-22.04',
              'timing_scope': 'five median recomputations plus one identical 64-operation incremental insertion batch after construction; input/build time excluded',
              'claim_gate': 'engineering same-algorithm storage-interface evidence only; public-graph storage evidence is reported separately for Teseo; not a general native Sortledton performance claim',
          }
          Path('artifacts/sortledton/metadata.json').write_text(json.dumps(payload, indent=2, sort_keys=True) + '\n')
          PY

      - name: Upload evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: velographx-sortledton-storage-swap
          path: artifacts/sortledton
          retention-days: 30
