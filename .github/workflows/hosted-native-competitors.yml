name: Hosted Native Competitor Evidence

on:
  push:
    paths:
      - '.github/workflows/hosted-native-competitors.yml'
      - 'tools/run_hosted_native_measurements.py'
      - 'benchmarks/native_baseline_benchmark.cpp'
      - 'CMakeLists.txt'
      - 'include/**'
      - 'src/**'
  pull_request:
    paths:
      - '.github/workflows/hosted-native-competitors.yml'
      - 'docs/hosted-native-competitors.md'
      - 'tools/run_hosted_native_measurements.py'
      - 'benchmarks/native_baseline_benchmark.cpp'
      - 'CMakeLists.txt'
  workflow_dispatch:

jobs:
  davis-native-baselines:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GRAPHBLAS_TAG: v10.5.0
      LAGRAPH_BRANCH: v1.3.x
      LAGRAPH_SHA: d01064de77b606473744b99f63b1487963556194
      GAPBS_TAG: v1.5
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libomp-dev

      - name: Capture hosted runner and compiler capacity
        run: |
          mkdir -p artifacts/native
          python - <<'PY'
          import json, os, platform, shutil, subprocess
          def cmd(argv):
              p = subprocess.run(argv, text=True, capture_output=True, check=False)
              return {"returncode": p.returncode, "stdout": p.stdout.strip(), "stderr": p.stderr.strip()}
          payload = {
              "research_claim": False,
              "publication_grade": False,
              "cpu_count": os.cpu_count(),
              "platform": platform.platform(),
              "machine": platform.machine(),
              "gcc": cmd(["gcc", "--version"]),
              "gxx": cmd(["g++", "--version"]),
              "icx_available": shutil.which("icx") is not None,
              "taskset": shutil.which("taskset"),
              "numactl": shutil.which("numactl"),
              "perf": shutil.which("perf"),
              "memory": cmd(["free", "-h"]),
              "lscpu": cmd(["lscpu"]),
              "openmp": {
                  "OMP_PLACES": "cores",
                  "OMP_PROC_BIND": "spread",
                  "OMP_DYNAMIC": "FALSE"
              }
          }
          open("artifacts/native/host-capacity.json", "w").write(json.dumps(payload, indent=2, sort_keys=True) + "\n")
          PY

      - name: Clone immutable native competitor revisions
        run: |
          git clone --depth 1 --branch "$GRAPHBLAS_TAG" https://github.com/DrTimothyAldenDavis/GraphBLAS.git external/GraphBLAS
          git clone https://github.com/GraphBLAS/LAGraph.git external/LAGraph
          git -C external/LAGraph checkout "$LAGRAPH_SHA"
          test "$(git -C external/LAGraph rev-parse HEAD)" = "$LAGRAPH_SHA"
          git clone --depth 1 --branch "$GAPBS_TAG" https://github.com/sbeamer/gapbs.git external/gapbs
          {
            echo "SuiteSparse:GraphBLAS $GRAPHBLAS_TAG $(git -C external/GraphBLAS rev-parse HEAD)"
            echo "LAGraph $LAGRAPH_BRANCH $LAGRAPH_SHA"
            echo "GAP Benchmark Suite $GAPBS_TAG $(git -C external/gapbs rev-parse HEAD)"
          } | tee artifacts/native/native-pins.txt

      - name: Build VeloGraphX tests and native benchmark
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DVELOGRAPHX_BUILD_TESTS=ON -DVELOGRAPHX_BUILD_BENCHMARKS=ON
          cmake --build build --parallel 4
          ctest --test-dir build --output-on-failure
          test -x build/velographx_native_baseline_benchmark

      - name: Build SuiteSparse GraphBLAS stable release
        run: |
          cmake -S external/GraphBLAS -B external/GraphBLAS/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$PWD/external/install"
          cmake --build external/GraphBLAS/build --parallel 4
          cmake --install external/GraphBLAS/build

      - name: Enable LAGraph benchmark self-checks
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('external/LAGraph/src/benchmark/LAGraph_demo.h')
          text = p.read_text()
          old = '#define LG_CHECK_RESULT 0'
          new = '#define LG_CHECK_RESULT 1'
          if old not in text:
              raise SystemExit('expected LAGraph self-check macro not found')
          p.write_text(text.replace(old, new, 1))
          PY

      - name: Build LAGraph v1.3.x against pinned GraphBLAS
        run: |
          cmake -S external/LAGraph -B external/LAGraph/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$PWD/external/install" \
            -DCMAKE_INSTALL_PREFIX="$PWD/external/install"
          cmake --build external/LAGraph/build --parallel 4
          cmake --install external/LAGraph/build
          test -x external/LAGraph/build/src/benchmark/bfs_demo
          test -x external/LAGraph/build/src/benchmark/sssp_demo
          test -f external/LAGraph/src/benchmark/do_gap_all

      - name: Build GAP BFS and SSSP
        run: |
          make -C external/gapbs bfs sssp -j4
          test -x external/gapbs/bfs
          test -x external/gapbs/sssp

      - name: Execute Davis-style same-runner BFS and SSSP campaign
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/external/install/lib:${{ github.workspace }}/external/install/lib64
          OMP_PLACES: cores
          OMP_PROC_BIND: spread
          OMP_DYNAMIC: 'FALSE'
        run: |
          python tools/run_hosted_native_measurements.py \
            --output-dir artifacts/native \
            --gap-bfs external/gapbs/bfs \
            --gap-sssp external/gapbs/sssp \
            --lagraph-bfs-demo external/LAGraph/build/src/benchmark/bfs_demo \
            --lagraph-sssp-demo external/LAGraph/build/src/benchmark/sssp_demo \
            --velographx-native-benchmark build/velographx_native_baseline_benchmark

      - name: Record immutable build evidence
        if: always()
        run: |
          python - <<'PY'
          import json, os, pathlib, subprocess
          def rev(path):
              return subprocess.check_output(["git", "-C", path, "rev-parse", "HEAD"], text=True).strip()
          def cmd(argv):
              p = subprocess.run(argv, text=True, capture_output=True, check=False)
              return p.stdout.strip() or p.stderr.strip()
          payload = {
              "schema_version": 3,
              "artifact_type": "velographx-davis-native-build",
              "research_claim": False,
              "publication_grade": False,
              "same_runner": True,
              "pins": {
                  "SuiteSparse:GraphBLAS": {"tag": os.environ["GRAPHBLAS_TAG"], "commit": rev("external/GraphBLAS")},
                  "LAGraph": {"branch": os.environ["LAGRAPH_BRANCH"], "commit": rev("external/LAGraph")},
                  "GAP Benchmark Suite": {"tag": os.environ["GAPBS_TAG"], "commit": rev("external/gapbs")},
              },
              "compiler": {"cxx": cmd(["g++", "--version"]), "openmp_runtime": "GCC/libgomp on hosted runner"},
              "openmp": {"OMP_PLACES": "cores", "OMP_PROC_BIND": "spread", "OMP_DYNAMIC": "FALSE"},
              "builds": {
                  "graphblas_library_present": any(pathlib.Path("external/install").rglob("libgraphblas*")),
                  "lagraph_library_present": any(pathlib.Path("external/install").rglob("liblagraph*")),
                  "lagraph_bfs_demo_present": pathlib.Path("external/LAGraph/build/src/benchmark/bfs_demo").is_file(),
                  "lagraph_sssp_demo_present": pathlib.Path("external/LAGraph/build/src/benchmark/sssp_demo").is_file(),
                  "gap_bfs_present": pathlib.Path("external/gapbs/bfs").is_file(),
                  "gap_sssp_present": pathlib.Path("external/gapbs/sssp").is_file(),
                  "velographx_native_benchmark_present": pathlib.Path("build/velographx_native_baseline_benchmark").is_file(),
              },
              "claim_gate": {
                  "publication_ready": False,
                  "allowed_claim": "Hosted-CI correctness-gated engineering evidence only."
              }
          }
          if pathlib.Path('external/GraphBLAS/.git').exists() and pathlib.Path('external/LAGraph/.git').exists() and pathlib.Path('external/gapbs/.git').exists():
              assert payload['pins']['LAGraph']['commit'] == os.environ['LAGRAPH_SHA']
          pathlib.Path("artifacts/native/native-build.json").write_text(json.dumps(payload, indent=2, sort_keys=True) + "\n")
          PY

      - name: Validate Davis campaign gates
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r = json.loads(Path('artifacts/native/davis-native-baseline-campaign.json').read_text())
          assert r['schema_version'] == 4
          assert r['research_claim'] is False
          assert r['publication_grade'] is False
          assert r['openmp']['OMP_PLACES'] == 'cores'
          assert r['openmp']['OMP_PROC_BIND'] == 'spread'
          assert r['correctness_gate']['passed'] is True
          assert r['correctness_gate']['static_all_engines_exact'] is True
          assert r['correctness_gate']['dynamic_all_engines_exact'] is True
          assert r['correctness_gate']['same_source_all_engines'] is True
          assert [x['paired']['threads'] for x in r['static']['bfs']] == [1, 2, 4]
          assert [x['paired']['threads'] for x in r['static']['sssp']] == [1, 2, 4]
          assert all(x['velographx']['repeat'] == 5 for x in r['static']['bfs'])
          assert all(x['gap']['repeat'] == 5 for x in r['static']['bfs'])
          assert all(x['lagraph']['repeat'] == 5 for x in r['static']['bfs'])
          assert all(x['velographx']['repeat'] == 5 for x in r['static']['sssp'])
          assert all(x['gap']['repeat'] == 5 for x in r['static']['sssp'])
          assert all(x['lagraph']['repeat'] == 5 for x in r['static']['sssp'])
          assert [x['fraction'] for x in r['dynamic_crossover']] == [0.001, 0.01, 0.05]
          assert r['claim_gate']['publication_ready'] is False
          PY

      - name: Upload hosted native evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: velographx-davis-native-baseline-evidence
          path: artifacts/native
          retention-days: 30
