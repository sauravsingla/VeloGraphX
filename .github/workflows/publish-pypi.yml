name: Publish Python Package

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  validate-release:
    name: Validate release tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Check tag matches package version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          version = tomllib.loads(Path('pyproject.toml').read_text())['project']['version']
          expected = f'v{version}'
          actual = os.environ['RELEASE_TAG']
          if actual != expected:
              raise SystemExit(f'Release tag {actual!r} does not match package version {expected!r}')
          print(f'Release tag validated: {actual}')
          PY

  wheels:
    name: Build wheels (${{ matrix.os }})
    needs: validate-release
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-15-intel
          - macos-14
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build and test wheels
        uses: pypa/cibuildwheel@v4.2.0
      - name: Upload wheels
        uses: actions/upload-artifact@v6
        with:
          name: pypi-wheels-${{ matrix.os }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  sdist:
    name: Build source distribution
    needs: validate-release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Build source distribution
        run: |
          python -m pip install --upgrade pip build
          python -m build --sdist
      - name: Upload source distribution
        uses: actions/upload-artifact@v6
        with:
          name: pypi-sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: [wheels, sdist]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/velographx/
    permissions:
      id-token: write
    steps:
      - name: Download release distributions
        uses: actions/download-artifact@v5
        with:
          pattern: pypi-*
          path: dist
          merge-multiple: true
      - name: Publish release distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
