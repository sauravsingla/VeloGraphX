name: CI
on:
  push:
  pull_request:

jobs:
  build-test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DVELOGRAPHX_BUILD_TESTS=ON -DVELOGRAPHX_BUILD_BENCHMARKS=ON
      - name: Build
        run: cmake --build build -j 2
      - name: Test
        run: ctest --test-dir build --output-on-failure --timeout 60
      - name: Static benchmark smoke
        run: ./build/velographx_benchmark
      - name: Dynamic benchmark smoke
        run: ./build/velographx_dynamic_benchmark

  sanitizers:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VELOGRAPHX_RANDOMIZED_OPS: 300
      VELOGRAPHX_RANDOMIZED_SEEDS: 2
    steps:
      - uses: actions/checkout@v4
      - name: Configure ASan/UBSan
        run: cmake -S . -B build-san -DCMAKE_BUILD_TYPE=Debug -DVELOGRAPHX_BUILD_TESTS=ON -DVELOGRAPHX_BUILD_BENCHMARKS=OFF -DVELOGRAPHX_ENABLE_SANITIZERS=ON
      - name: Build
        run: cmake --build build-san -j 2
      - name: Test
        run: ctest --test-dir build-san --output-on-failure --timeout 60 -V

  dataset-manifest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare checksum-verified fixture
        run: |
          mkdir -p build
          python tools/prepare_dataset.py \
            --manifest datasets/manifest.example.json \
            --output-dir build/datasets \
            --dataset example-local-edge-list > build/dataset-prepared.json
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('build/dataset-prepared.json').read_text())
          assert report['schema_version'] == 1
          assert len(report['prepared']) == 1
          item = report['prepared'][0]
          assert item['name'] == 'example-local-edge-list'
          assert item['sha256'] == 'b2d516ac2fbfdf330a3807ea2448b0f4c0e9f82abd7a9eefdb1522aa364ec48e'
          assert Path(item['path']).read_text() == '0 1\n1 2\n2 0\n'
          PY
      - name: Reject checksum mismatch specifically
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path('datasets/manifest.example.json').read_text())
          manifest['datasets'][0]['sha256'] = '0' * 64
          Path('datasets/bad-manifest.json').write_text(json.dumps(manifest))
          PY
          if python tools/prepare_dataset.py --manifest datasets/bad-manifest.json --output-dir build/bad 2> build/bad-checksum.err; then
            echo 'checksum mismatch unexpectedly accepted' >&2
            exit 1
          fi
          grep -Fqi 'sha256 mismatch' build/bad-checksum.err
      - name: Validate competitor adapter contract
        run: |
          python tools/competitor_benchmark.py \
            --dataset datasets/example-local-edge-list.txt \
            --framework builtin \
            --repeat 2 \
            --output build/competitor-builtin.json
          python tools/competitor_benchmark.py \
            --dataset datasets/example-local-edge-list.txt \
            --framework external \
            --external-command "python tools/mock_external_bfs.py" \
            --external-name native-contract-fixture \
            --repeat 2 \
            --output build/competitor-external.json
          python - <<'PY'
          import json
          from pathlib import Path
          builtin = json.loads(Path('build/competitor-builtin.json').read_text())
          external = json.loads(Path('build/competitor-external.json').read_text())
          assert builtin['adapter'] == 'builtin'
          assert external['adapter'] == 'external'
          assert external['framework'] == 'native-contract-fixture'
          assert external['framework_version'] == 'contract-fixture-1'
          assert builtin['dataset_sha256'] == external['dataset_sha256']
          assert builtin['result_digest'] == external['result_digest']
          assert builtin['reachable_vertices'] == external['reachable_vertices'] == 3
          assert len(external['timings_seconds']) == 2
          PY

  python-bindings:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python build and interoperability dependencies
        run: python -m pip install --upgrade pip pybind11 numpy scipy pyarrow
      - name: Configure Python bindings
        run: cmake -S . -B build-python -DCMAKE_BUILD_TYPE=Release -DVELOGRAPHX_BUILD_TESTS=OFF -DVELOGRAPHX_BUILD_BENCHMARKS=OFF -DVELOGRAPHX_BUILD_PYTHON=ON -Dpybind11_DIR="$(python -m pybind11 --cmakedir)"
      - name: Build Python bindings
        run: cmake --build build-python -j 2
      - name: Python NumPy SciPy Arrow incremental smoke
        run: |
          PYTHONPATH=build-python/python python - <<'PY'
          import gc
          import numpy as np
          import scipy.sparse as sp
          import pyarrow as pa
          import velographx as vx

          edges = np.array([[0, 1], [1, 2], [2, 0]], dtype=np.uint32)
          g = vx.from_numpy_edges(edges)
          del edges
          gc.collect()
          assert g.vertex_count == 3
          assert g.neighbors(0) == [1, 2]

          csr = sp.csr_matrix((np.ones(3), ([0, 1, 2], [1, 2, 0])), shape=(3, 3))
          g2 = vx.from_scipy_csr(csr, directed=True)
          del csr
          gc.collect()
          assert g2.vertex_count == 3
          assert g2.neighbors(1) == [2]

          table = pa.table({"src": pa.array([0, 1, 2], type=pa.uint32()),
                            "dst": pa.array([1, 2, 0], type=pa.uint32())})
          g3 = vx.from_arrow_table(table, directed=True)
          del table
          gc.collect()
          assert g3.vertex_count == 3
          assert g3.neighbors(1) == [2]

          g4 = vx.Graph(4, False)
          batch = vx.UpdateBatch()
          batch.add(0, 1); batch.add(1, 2)
          g4.apply(batch)
          bfs = vx.IncrementalBFS(g4, 0)
          assert bfs.distances == [0, 1, 2, vx.IncrementalBFS.unreachable]
          update = vx.UpdateBatch(); update.add(2, 3)
          bfs.apply(update)
          assert bfs.distances == [0, 1, 2, 3]

          g5 = vx.Graph(6, False)
          initial = vx.UpdateBatch()
          initial.add(0, 1); initial.add(1, 2); initial.add(3, 4); initial.add(4, 5)
          g5.apply(initial)
          cc = vx.IncrementalComponents(g5)
          deletion = vx.UpdateBatch(); deletion.remove(1, 2)
          cc.apply(deletion)
          assert cc.component(0) != cc.component(2)
          assert cc.last_repaired_vertices == 3

          g6 = vx.Graph(6, False)
          kinit = vx.UpdateBatch()
          kinit.add(0, 1); kinit.add(1, 2); kinit.add(2, 0); kinit.add(3, 4)
          g6.apply(kinit)
          kc = vx.IncrementalKCore(g6)
          assert kc.core[:3] == [2, 2, 2]
          kdel = vx.UpdateBatch(); kdel.remove(1, 2)
          kc.apply(kdel)
          assert kc.core[:3] == [1, 1, 1]
          assert kc.last_repaired_vertices == 3

          g7 = vx.Graph(5, True)
          pinit = vx.UpdateBatch()
          pinit.add(0, 1); pinit.add(1, 2); pinit.add(2, 0); pinit.add(2, 3); pinit.add(3, 4)
          g7.apply(pinit)
          pr = vx.IncrementalPageRank(g7)
          pup = vx.UpdateBatch(); pup.add(4, 0)
          pr.apply(pup)
          assert len(pr.values) == 5
          assert pr.last_repaired_vertices > 0

          wg = vx.WeightedGraph(5, True)
          wb = vx.WeightedUpdateBatch()
          wb.add(0, 1, 5); wb.add(1, 2, 4); wb.add(0, 2, 20); wb.add(2, 3, 3)
          wg.apply(wb)
          sssp = vx.IncrementalWeightedSSSP(wg, 0)
          assert sssp.distances[:4] == [0, 5, 9, 12]
          improve = vx.WeightedUpdateBatch(); improve.update(0, 2, 2)
          sssp.apply(improve)
          assert sssp.distances[:4] == [0, 5, 2, 5]
          destructive = vx.WeightedUpdateBatch(); destructive.remove(0, 2)
          sssp.apply(destructive)
          assert sssp.distances[:4] == [0, 5, 9, 12]
          assert sssp.distances[4] == vx.IncrementalWeightedSSSP.unreachable
          PY
