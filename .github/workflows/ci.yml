name: CI
on:
  push:
  pull_request:

jobs:
  build-test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DVELOGRAPHX_BUILD_TESTS=ON -DVELOGRAPHX_BUILD_BENCHMARKS=ON
      - name: Build
        run: cmake --build build -j 2
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Static benchmark smoke
        run: ./build/velographx_benchmark
      - name: Dynamic benchmark smoke
        run: ./build/velographx_dynamic_benchmark

  sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure ASan/UBSan
        run: cmake -S . -B build-san -DCMAKE_BUILD_TYPE=Debug -DVELOGRAPHX_BUILD_TESTS=ON -DVELOGRAPHX_BUILD_BENCHMARKS=OFF -DVELOGRAPHX_ENABLE_SANITIZERS=ON
      - name: Build
        run: cmake --build build-san -j 2
      - name: Test
        run: ctest --test-dir build-san --output-on-failure
