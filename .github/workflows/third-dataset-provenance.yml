name: Third Dataset Provenance Bootstrap

on:
  push:
    paths:
      - '.github/workflows/third-dataset-provenance.yml'
  workflow_dispatch:

jobs:
  provenance:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Download and fingerprint SNAP soc-Epinions1
        run: |
          mkdir -p build/third-dataset
          curl --fail --location --retry 3 https://snap.stanford.edu/data/soc-Epinions1.txt.gz -o build/third-dataset/soc-Epinions1.txt.gz
          echo '8df7433d4486ba68eb25e623feacff04  build/third-dataset/soc-Epinions1.txt.gz' | md5sum -c -
          sha256sum build/third-dataset/soc-Epinions1.txt.gz | tee build/third-dataset/source-gzip-sha256.txt
          gzip -dc build/third-dataset/soc-Epinions1.txt.gz > build/third-dataset/soc-Epinions1.txt
          sha256sum build/third-dataset/soc-Epinions1.txt | tee build/third-dataset/source-text-sha256.txt
          python - <<'PY'
          from pathlib import Path
          p=Path('build/third-dataset/soc-Epinions1.txt')
          vertices=set(); edges=0; loops=0
          for raw in p.open():
              line=raw.strip()
              if not line or line.startswith('#'): continue
              u,v=map(int,line.split()[:2]); vertices.update((u,v)); edges+=1; loops += (u==v)
          print(f'vertices={len(vertices)} edges={edges} self_loops={loops} min={min(vertices)} max={max(vertices)}')
          assert len(vertices)==75879
          assert edges==508837
          assert loops==0
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: soc-Epinions1-provenance
          path: build/third-dataset/
          retention-days: 90
