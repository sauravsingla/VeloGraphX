name: PVLDB Paper Build

on:
  push:
    paths:
      - '.github/workflows/pvldb-paper.yml'

permissions:
  contents: write

jobs:
  apply-deep-review-fixes:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: paper-deep-review-fixes
          fetch-depth: 0

      - name: Execute staged patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          # Replace one brittle source-line insertion in the staged patch with
          # a line-oriented edit before executing it. The scientific content is
          # unchanged; this only makes the patch robust to LaTeX escaping.
          path = Path('.github/workflows/apply-paper-deep-review-fixes.yml')
          stage = path.read_text()
          marker = "          prep = replace_once(\n              prep,\n              'Dynamic BFS, ca-GrQc"
          start = stage.index(marker)
          end_marker = "\n\n          # Replace the old substring-based injector entirely with exact line anchors."
          end = stage.index(end_marker, start)
          replacement = '''          needle = 'Dynamic BFS, ca-GrQc & VeloGraphX vs NetworKit'
          row_start = prep.index(needle)
          row_end = prep.index('\\n', row_start) + 1
          ris_row = r'''Dynamic BFS, web-Google (separate run) & VeloGraphX vs RisGraph & {ris["risgraph_faster_than_velographx_ratio"]:.2f}$\\times$ lower latency for RisGraph & RisGraph \\\\''' + '\\n'
          prep = prep[:row_end] + ris_row + prep[row_end:]
'''
          stage = stage[:start] + replacement + stage[end:]
          path.write_text(stage)

          lines = stage.splitlines()
          begin = next(i for i, line in enumerate(lines) if "python - <<'PY'" in line) + 1
          end = next(i for i in range(begin, len(lines)) if lines[i].strip() == 'PY')
          code_lines = lines[begin:end]
          prefix = '          '
          code = '\n'.join(line[len(prefix):] if line.startswith(prefix) else line for line in code_lines)
          exec(compile(code, str(path), 'exec'))
          PY

      - name: Restore workflow files and validate
        shell: bash
        run: |
          git show origin/main:.github/workflows/pvldb-paper.yml > .github/workflows/pvldb-paper.yml
          rm .github/workflows/apply-paper-deep-review-fixes.yml
          python paper/validate_submission_data.py
          python -m py_compile paper/vldb/prepare_submission.py paper/figures/generate_figures.py
          git diff --check
          git status --short

      - name: Commit reviewer fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "paper: address deep reviewer blockers"
          git push origin HEAD:paper-deep-review-fixes
