name: Publish VeloGraphX Hugging Face Space

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'hf-space/**'
      - 'tools/build_huggingface_space.py'
      - '.github/workflows/publish-huggingface-space.yml'

permissions:
  id-token: write
  contents: read

concurrency:
  group: publish-velographx-huggingface-space
  cancel-in-progress: true

jobs:
  publish-space:
    runs-on: ubuntu-latest

    steps:
      - name: Check out VeloGraphX
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Prepare and validate Space evidence
        run: python tools/build_huggingface_space.py

      - name: Install Hugging Face CLI
        shell: bash
        run: |
          set -euo pipefail
          curl -LsSf https://hf.co/cli/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Publish Space through Trusted Publisher
        env:
          HF_OIDC_RESOURCE: spaces/sauravsingla08/VeloGraphX
        shell: bash
        run: |
          set -euo pipefail
          hf upload \
            spaces/sauravsingla08/VeloGraphX \
            ./hf-space \
            . \
            --commit-message "Publish VeloGraphX Space from ${GITHUB_SHA::7}"

      - name: Publication summary
        if: success()
        shell: bash
        run: |
          {
            echo "## Hugging Face Space publication complete"
            echo
            echo "- Space: https://huggingface.co/spaces/sauravsingla08/VeloGraphX"
            echo "- Dataset: https://huggingface.co/datasets/sauravsingla08/velographx-benchmarks"
            echo "- Source commit: \`${GITHUB_SHA}\`"
            echo "- Authentication: Hugging Face Trusted Publisher (OIDC)"
          } >> "$GITHUB_STEP_SUMMARY"
