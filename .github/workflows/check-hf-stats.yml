name: Check Hugging Face Stats

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/check-hf-stats.yml'

permissions:
  contents: write

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Query VeloGraphX Hugging Face stats
        shell: bash
        run: |
          python - <<'PY'
          import json
          import urllib.request
          from pathlib import Path

          url = "https://huggingface.co/api/datasets/sauravsingla08/velographx-benchmarks"
          with urllib.request.urlopen(url, timeout=30) as response:
              data = json.load(response)

          lines = [
              "HF_REPO=" + str(data.get("id")),
              "HF_DOWNLOADS=" + str(data.get("downloads")),
              "HF_DOWNLOADS_ALL_TIME=" + str(data.get("downloadsAllTime")),
              "HF_LIKES=" + str(data.get("likes")),
              "HF_LAST_MODIFIED=" + str(data.get("lastModified")),
          ]
          Path("hf-stats.txt").write_text("\n".join(lines) + "\n", encoding="utf-8")
          print("\n".join(lines))
          PY

      - name: Commit temporary result
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hf-stats.txt
          git commit -m "chore: record temporary Hugging Face stats"
          git push
