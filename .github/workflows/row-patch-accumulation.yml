name: Row Patch Accumulation Evidence

on:
  push:
    paths:
      - '.github/workflows/row-patch-accumulation.yml'
      - 'include/velographx/storage/consolidation.hpp'
      - 'include/velographx/storage/dynamic_graph.hpp'
      - 'benchmarks/row_patch_accumulation.cpp'
      - 'datasets/manifest.public-small.json'
      - 'tools/prepare_dataset.py'
      - 'tools/normalize_edge_list.py'
      - 'CMakeLists.txt'
  workflow_dispatch:

jobs:
  real-irregular:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - dataset: ca-GrQc
            cycles: 5
            vertices: 5242
            directed: 0
            rows: 64
            probes: 2048
            repeats: 5
          - dataset: ca-GrQc
            cycles: 20
            vertices: 5242
            directed: 0
            rows: 64
            probes: 2048
            repeats: 5
          - dataset: ca-GrQc
            cycles: 50
            vertices: 5242
            directed: 0
            rows: 64
            probes: 2048
            repeats: 5
          - dataset: web-Google
            cycles: 5
            vertices: 875713
            directed: 1
            rows: 4096
            probes: 4096
            repeats: 3
          - dataset: web-Google
            cycles: 20
            vertices: 875713
            directed: 1
            rows: 4096
            probes: 4096
            repeats: 3
          - dataset: web-Google
            cycles: 50
            vertices: 875713
            directed: 1
            rows: 4096
            probes: 4096
            repeats: 3
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Prepare checksum-pinned real graph
        run: |
          mkdir -p build/row-patch/source
          python tools/prepare_dataset.py \
            --manifest datasets/manifest.public-small.json \
            --output-dir build/row-patch/source \
            --dataset '${{ matrix.dataset }}' > build/row-patch/dataset-prepared.json
          directed_flag=''
          if [ '${{ matrix.directed }}' = '1' ]; then directed_flag='--directed'; fi
          python tools/normalize_edge_list.py \
            --input 'build/row-patch/source/${{ matrix.dataset }}.txt' \
            --output 'build/row-patch/${{ matrix.dataset }}-normalized.txt' \
            --report build/row-patch/normalization.json \
            $directed_flag
      - name: Build accumulation benchmark
        run: |
          cmake -S . -B build/cmake -DCMAKE_BUILD_TYPE=Release -DVELOGRAPHX_BUILD_TESTS=OFF -DVELOGRAPHX_BUILD_BENCHMARKS=ON
          cmake --build build/cmake --target velographx_row_patch_accumulation -j 2
      - name: Run long-lived row-patch campaign
        run: |
          out='build/row-patch/${{ matrix.dataset }}-${{ matrix.cycles }}'
          mkdir -p "$out"
          python tools/capture_benchmark_environment.py \
            --label 'row-patch-${{ matrix.dataset }}-${{ matrix.cycles }}' \
            --output "$out/environment.json"
          : > "$out/runs.jsonl"
          for i in $(seq 1 ${{ matrix.repeats }}); do
            build/cmake/velographx_row_patch_accumulation \
              'build/row-patch/${{ matrix.dataset }}-normalized.txt' \
              ${{ matrix.cycles }} ${{ matrix.rows }} ${{ matrix.probes }} ${{ matrix.directed }} \
              >> "$out/runs.jsonl"
          done
          python - <<'PY'
          import json, statistics
          from pathlib import Path
          dataset = '${{ matrix.dataset }}'
          cycles = int('${{ matrix.cycles }}')
          expected_vertices = int('${{ matrix.vertices }}')
          expected_directed = bool(int('${{ matrix.directed }}'))
          expected_repeats = int('${{ matrix.repeats }}')
          rows_per_cycle = int('${{ matrix.rows }}')
          out = Path(f'build/row-patch/{dataset}-{cycles}')
          rows = [json.loads(x) for x in (out / 'runs.jsonl').read_text().splitlines() if x.strip()]
          normalization = json.loads(Path('build/row-patch/normalization.json').read_text())
          assert len(rows) == expected_repeats
          assert all(r['correct'] for r in rows)
          assert {r['vertices'] for r in rows} == {expected_vertices}
          assert {r['directed'] for r in rows} == {expected_directed}
          assert normalization['directed'] is expected_directed
          initial_ns = statistics.median(r['initial_neighbor_ns'] for r in rows)
          pre_ns = statistics.median(r['pre_consolidation_neighbor_ns'] for r in rows)
          post_ns = statistics.median(r['post_consolidation_neighbor_ns'] for r in rows)
          summary = {
            'schema_version': 2,
            'artifact_type': 'velographx-row-patch-accumulation-summary',
            'dataset': dataset,
            'dataset_sha256': normalization['source_sha256'],
            'normalized_sha256': normalization['output_sha256'],
            'directed': expected_directed,
            'vertices': normalization['vertex_count'],
            'normalized_edges': normalization['edge_count'],
            'cycles': cycles,
            'rows_per_cycle': rows_per_cycle,
            'repeats': len(rows),
            'research_claim': False,
            'all_correct': True,
            'median_storage_growth_ratio': statistics.median(r['storage_growth_ratio'] for r in rows),
            'median_post_consolidation_storage_ratio': statistics.median(r['post_consolidation_storage_ratio'] for r in rows),
            'median_initial_neighbor_ns': initial_ns,
            'median_pre_consolidation_neighbor_ns': pre_ns,
            'median_post_consolidation_neighbor_ns': post_ns,
            'median_neighbor_degradation_ratio': pre_ns / initial_ns,
            'median_neighbor_recovery_ratio': post_ns / pre_ns,
            'median_consolidation_ms': statistics.median(r['consolidation_ms'] for r in rows),
            'median_total_update_ms': statistics.median(r['total_update_ms'] for r in rows),
            'median_total_row_compaction_ms': statistics.median(r['total_row_compaction_ms'] for r in rows),
            'median_applied_update_operations': statistics.median(r['applied_update_operations'] for r in rows),
          }
          (out / 'summary.json').write_text(json.dumps(summary, indent=2, sort_keys=True) + '\n')
          print(json.dumps(summary, sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: velographx-row-patch-${{ matrix.dataset }}-${{ matrix.cycles }}
          path: build/row-patch/${{ matrix.dataset }}-${{ matrix.cycles }}/
          retention-days: 90
