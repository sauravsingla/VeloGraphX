name: GraphBolt DZiG GAP Publication Contract

on:
  pull_request:
    paths:
      - '.github/workflows/external-graphbolt-dzig-gap-publication.yml'
      - 'tools/prepare_graphbolt_workload.py'
      - 'tools/configure_publication_cpu.py'
      - 'tools/capture_benchmark_environment.py'
      - 'tools/validate_publication_measurements.py'
      - 'tools/parse_graphbolt_dzig_output.py'
      - 'tools/verify_graphbolt_bfs_output.py'
      - 'benchmarks/fixtures/graphbolt-dzig-output.txt'
      - 'benchmarks/fixtures/graphbolt-bfs-output.txt'
      - 'docs/graphbolt-dzig-gap-benchmark-contract.md'
  push:
    branches: [main]
    paths:
      - '.github/workflows/external-graphbolt-dzig-gap-publication.yml'
      - 'tools/prepare_graphbolt_workload.py'
      - 'tools/configure_publication_cpu.py'
      - 'tools/capture_benchmark_environment.py'
      - 'tools/validate_publication_measurements.py'
      - 'tools/parse_graphbolt_dzig_output.py'
      - 'tools/verify_graphbolt_bfs_output.py'
      - 'benchmarks/fixtures/graphbolt-dzig-output.txt'
      - 'benchmarks/fixtures/graphbolt-bfs-output.txt'
  workflow_dispatch:

jobs:
  contract:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify deterministic neutral workload
        run: |
          python tools/prepare_graphbolt_workload.py --input datasets/example-local-edge-list.txt --output-dir build/work-a --seed 41 --chunk-rows 1
          python tools/prepare_graphbolt_workload.py --input datasets/example-local-edge-list.txt --output-dir build/work-b --seed 41 --chunk-rows 2
          diff -ru build/work-a build/work-b
          python - <<'PY'
          import json
          data=json.load(open('build/work-a/metadata.json'))
          assert data['files']['graphbolt.stream']['rows'] == 2
          stream=open('build/work-a/graphbolt.stream').read().splitlines()
          assert stream[0].startswith('a ') and stream[1].startswith('d ')
          PY
      - name: Pin and inspect official DZiG artifact
        env:
          GRAPHBOLT_SHA: 2d56f39cb17c85d624bee6a63f8fc34a8f149a36
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/pdclab/graphbolt.git build/graphbolt
          git -C build/graphbolt checkout --detach "$GRAPHBOLT_SHA"
          test "$(git -C build/graphbolt rev-parse HEAD)" = "$GRAPHBOLT_SHA"
          test "$(git -C build/graphbolt rev-parse --abbrev-ref HEAD)" = HEAD
          grep -Fq -- '-fixedBatchSize' build/graphbolt/AE_README.md
          grep -Fq -- '-enforceEdgeValidity' build/graphbolt/AE_README.md
          grep -Fq -- 'Finished batch' build/graphbolt/AE_README.md
          printf 'repository=https://github.com/pdclab/graphbolt.git\nbranch=eurosys21-artifact\ncommit=%s\n' "$GRAPHBOLT_SHA" > build/graphbolt-pin.txt
      - name: Verify native-output timing and work parser
        run: |
          python tools/parse_graphbolt_dzig_output.py \
            --input benchmarks/fixtures/graphbolt-dzig-output.txt \
            --output build/graphbolt-parsed.json --expected-batches 1 \
            --expected-operations 1000 --require-work
          python - <<'PY'
          import json
          row=json.load(open('build/graphbolt-parsed.json'))['batches'][0]
          assert abs(row['mutation_seconds'] - 0.001103) < 1e-12
          assert abs(row['answer_ready_seconds'] - 0.004384) < 1e-12
          assert row['edges_processed'] == 357552
          PY
      - name: Verify independent GraphBolt BFS exactness gate
        run: |
          python tools/verify_graphbolt_bfs_output.py \
            --initial build/work-a/initial.edges \
            --stream build/work-a/graphbolt.stream \
            --graphbolt-output benchmarks/fixtures/graphbolt-bfs-output.txt \
            --source 0 --output build/graphbolt-bfs-exactness.json
          python -c "import json; assert json.load(open('build/graphbolt-bfs-exactness.json'))['exact']"
      - name: Verify physical-core plan and environment evidence
        run: |
          python tools/configure_publication_cpu.py --threads 1 --output build/cpu-plan.json --shell-output build/cpu-env.sh
          . build/cpu-env.sh
          python tools/capture_benchmark_environment.py --label graphbolt-gap-contract --output build/environment.json
          python - <<'PY'
          import json
          plan=json.load(open('build/cpu-plan.json'))
          env=json.load(open('build/environment.json'))
          assert plan['requested_threads'] == 1 and len(plan['selected_cpu_list']) == 1
          assert env['hardware']['linux_topology']['process_allowed_cpu_list']
          assert env['openmp_environment']['GOMP_CPU_AFFINITY'] == plan['gomp_cpu_affinity']
          PY
      - name: Verify raw-sample quality gate
        run: |
          mkdir -p build
          printf '{"1":[2000,2100,2050,2075,2025],"2":[1100,1200,1150,1175,1125]}\n' > build/samples.json
          python tools/validate_publication_measurements.py --input build/samples.json --output build/quality.json --require-scaling
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: graphbolt-dzig-gap-contract
          path: build/
          retention-days: 90

  hosted-legacy-runtime:
    name: GraphBolt official legacy runtime smoke
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build pinned GraphBolt with its required GCC Cilk Plus stack
        env:
          GRAPHBOLT_SHA: 2d56f39cb17c85d624bee6a63f8fc34a8f149a36
        run: |
          mkdir -p build/graphbolt-hosted
          docker run --rm \
            -e DEBIAN_FRONTEND=noninteractive \
            -e GRAPHBOLT_SHA="$GRAPHBOLT_SHA" \
            -v "$PWD/build/graphbolt-hosted:/evidence" \
            ubuntu:18.04 bash -euxo pipefail -c '
              apt-get update
              apt-get install -y --no-install-recommends ca-certificates git build-essential gcc-7 g++-7 cmake make
              update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-7 70
              update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-7 70
              g++ --version | tee /evidence/gcc-version.txt
              git clone --filter=blob:none https://github.com/pdclab/graphbolt.git /tmp/graphbolt
              git -C /tmp/graphbolt checkout --detach "$GRAPHBOLT_SHA"
              test "$(git -C /tmp/graphbolt rev-parse HEAD)" = "$GRAPHBOLT_SHA"
              cd /tmp/graphbolt
              sh install_mimalloc.sh
              test -f lib/mimalloc/out/release/libmimalloc.so
              make -C apps clean
              make -C apps WORKFLAG=1 BFS
              test -x apps/BFS
              ldd apps/BFS | tee /evidence/graphbolt-bfs-ldd.txt
              printf "graphbolt_sha=%s\nmimalloc=v1.6.0\ncompiler=g++-7\ncilk_plus=true\nhosted_ci_engineering_evidence=true\nresearch_claim=false\n" "$GRAPHBOLT_SHA" > /evidence/runtime-pin.txt
            '
      - name: Record hosted runner and container boundary
        run: |
          {
            echo 'runner=github-hosted ubuntu-22.04'
            echo 'graphbolt_runtime_container=ubuntu:18.04'
            echo 'purpose=compatibility/build gate only'
            echo 'performance_claim=false'
          } > build/graphbolt-hosted/evidence-scope.txt
          lscpu > build/graphbolt-hosted/host-lscpu.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: graphbolt-official-legacy-runtime-smoke
          path: build/graphbolt-hosted/
          retention-days: 90
