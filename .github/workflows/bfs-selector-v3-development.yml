name: BFS Selector V3 Development

on:
  push:
    paths:
      - 'benchmarks/publication_policy_bfs_v3_light3.cpp'
      - 'benchmarks/adaptive_policy_bfs.cpp'
      - 'tools/summarize_bfs_selector_runs.py'
      - 'tools/generate_reviewer_holdout.py'
      - 'tools/generate_selector_v2_holdout.py'
      - 'include/**'
      - 'src/**'
      - 'tests/test_incremental_bfs_deletion.cpp'
      - '.github/workflows/bfs-selector-v3-development.yml'
  pull_request:
    paths:
      - 'benchmarks/publication_policy_bfs_v3_light3.cpp'
      - 'benchmarks/adaptive_policy_bfs.cpp'
      - 'tools/summarize_bfs_selector_runs.py'
      - 'tools/generate_reviewer_holdout.py'
      - 'tools/generate_selector_v2_holdout.py'
      - 'include/**'
      - 'src/**'
      - 'tests/test_incremental_bfs_deletion.cpp'
      - '.github/workflows/bfs-selector-v3-development.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  OMP_NUM_THREADS: '1'
  OMP_PROC_BIND: 'true'
  SIMPLE_UPDATE_FRACTION: '0.01'

jobs:
  seen-development:
    runs-on: ubuntu-22.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build

      - name: Prepare current-reach selector candidate
        run: |
          mkdir -p build/v3
          python - <<'PY'
          from pathlib import Path
          source = Path('benchmarks/publication_policy_bfs_v3_light3.cpp')
          src = source.read_text()

          # Preserve the road-safe confirmation behavior already established on
          # the seen development sets. This is the only retained prior patch.
          anchor = 'if (confirmation_batch) {'
          terminator = '} else if (normalized_tail >= kLearnedFullMargin) {'
          reset_needle = '        incremental_tail_ratio = std::max(decayed_tail, normalized_tail);'
          reset_replacement = '        incremental_tail_ratio = normalized_tail;'
          assert src.count(anchor) == 1, 'confirmation branch count changed unexpectedly'
          start = src.index(anchor)
          end = src.index(terminator, start)
          block = src[start:end]
          assert block.count(reset_needle) == 1, 'confirmation assignment missing or ambiguous'
          block = block.replace(reset_needle, reset_replacement)
          out = src[:start] + block + src[end:]
          assert out.count(reset_replacement) == 1, 'confirmation reset was not uniquely applied'
          assert out[end:].count(reset_needle) >= 1, 'new-tail persistence path must remain intact'

          # Use the engine's exact maintained O(1) reachability count instead of
          # rescanning the distance vector. Keep the initial snapshot only as the
          # state attached to the initial measured full-BFS cost.
          scan_needle = 'reachable_vertices(bfs.distances())'
          assert out.count(scan_needle) == 1, 'adaptive reachability scan changed unexpectedly'
          out = out.replace(scan_needle, 'bfs.reachable_count()')

          state_needle = '  double latest_full_us = initial_full_us;\n'
          state_replacement = ('  double latest_full_us = initial_full_us;\n'
                               '  std::size_t last_full_reachable_count = bfs.reachable_count();\n')
          assert out.count(state_needle) == 1, 'full-cost state anchor changed unexpectedly'
          out = out.replace(state_needle, state_replacement)

          trace_needle = '    t.reachable_fraction = reachable_fraction;'
          trace_replacement = ('    const std::size_t current_reachable_count = bfs.reachable_count();\n'
                               '    t.reachable_fraction = static_cast<double>(current_reachable_count) /\n'
                               '        static_cast<double>(std::max<std::size_t>(1, vertices));')
          assert out.count(trace_needle) == 1, 'per-batch reachability trace anchor changed unexpectedly'
          out = out.replace(trace_needle, trace_replacement)

          # Full BFS cost is scaled by the exact reachable work since the last
          # directly measured full recomputation. No graph-family threshold is
          # introduced and no unseen H6 evidence is consumed.
          full_needle = '      t.predicted_full_us = latest_full_us;'
          full_replacement = ('      const double reachable_work_ratio =\n'
                              '          static_cast<double>(current_reachable_count) /\n'
                              '          static_cast<double>(std::max<std::size_t>(1, last_full_reachable_count));\n'
                              '      t.predicted_full_us = latest_full_us * reachable_work_ratio;')
          assert out.count(full_needle) == 1, 'full prediction anchor changed unexpectedly'
          out = out.replace(full_needle, full_replacement)

          observed_needle = '      latest_full_us = execution_us;\n'
          observed_replacement = ('      latest_full_us = execution_us;\n'
                                  '      last_full_reachable_count = bfs.reachable_count();\n')
          assert out.count(observed_needle) == 1, 'full observation anchor changed unexpectedly'
          out = out.replace(observed_needle, observed_replacement)

          adaptive = out[out.index('L3Result run_adaptive_l3'):]
          assert 'reachable_vertices(bfs.distances())' not in adaptive
          assert adaptive.count('bfs.reachable_count()') >= 4
          Path('build/v3/publication_policy_bfs_v3_light3_reachfix.cpp').write_text(out)
          PY

      - name: Build and test reachable-count invariant
        run: |
          cmake -S . -B build/vx -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DVELOGRAPHX_BUILD_TESTS=ON \
            -DVELOGRAPHX_BUILD_BENCHMARKS=OFF
          cmake --build build/vx --target test_incremental_bfs_deletion -j 2
          ./build/vx/test_incremental_bfs_deletion

      - name: Build current-reach BFS selector candidate
        run: |
          cmake --build build/vx --target velographx -j 2
          c++ -O3 -DNDEBUG -std=c++20 -Iinclude -Ibenchmarks \
            build/v3/publication_policy_bfs_v3_light3_reachfix.cpp \
            build/vx/libvelographx.a -pthread \
            -o build/publication_policy_bfs_v3_light3_reachfix

      - name: Generate seen development graph families
        run: |
          mkdir -p build/v3/{graphs,road,h4,summary}
          python tools/generate_reviewer_holdout.py \
            --mode road-smallworld --seed 20260914 --width 192 --height 192 \
            --output build/v3/graphs/road.txt \
            --metadata build/v3/graphs/road.json
          python tools/generate_selector_v2_holdout.py \
            --mode chain-hubs-directed --seed 2026091501 --vertices 32768 \
            --output build/v3/graphs/h4.txt \
            --metadata build/v3/graphs/h4.json
          test "$(python -c 'import json; print(json.load(open("build/v3/graphs/h4.json"))["sha256"])')" = \
            '4278e3cf0ba460fd485814e5e4133b09c66f87d76d931772b332625c921537cc'

      - name: Run seen road development family
        run: |
          python - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          for rep in range(3):
              for root in (0, 18528, 36863):
                  for batch in (128, 512, 2048):
                      out = Path(f'build/v3/road/road-rep{rep}-r{root}__{batch}.json')
                      with out.open('w') as f:
                          subprocess.run([
                              'build/publication_policy_bfs_v3_light3_reachfix',
                              'build/v3/graphs/road.txt', str(root), '0.95', str(batch),
                              os.environ['SIMPLE_UPDATE_FRACTION']
                          ], stdout=f, check=True)
                      d = json.load(out.open())
                      assert d['selector'] == 'publication-preflight-bfs-v3-light3'
                      assert d['research_claim'] is False
                      assert d['all_policies_exact']
          PY

      - name: Run seen H4 development family
        run: |
          python - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          for rep in range(3):
              for root in (0, 16384, 32767):
                  for batch in (128, 512, 2048):
                      out = Path(f'build/v3/h4/h4-rep{rep}-r{root}__{batch}.json')
                      with out.open('w') as f:
                          subprocess.run([
                              'build/publication_policy_bfs_v3_light3_reachfix',
                              'build/v3/graphs/h4.txt', str(root), '0.95', str(batch),
                              os.environ['SIMPLE_UPDATE_FRACTION']
                          ], stdout=f, check=True)
                      d = json.load(out.open())
                      assert d['selector'] == 'publication-preflight-bfs-v3-light3'
                      assert d['research_claim'] is False
                      assert d['all_policies_exact']
          PY

      - name: Summarize seen-development evidence
        run: |
          python tools/summarize_bfs_selector_runs.py \
            --input build/v3/road --output build/v3/summary/road.json \
            | tee build/v3/summary/road.stdout.json
          python tools/summarize_bfs_selector_runs.py \
            --input build/v3/h4 --output build/v3/summary/h4.json \
            | tee build/v3/summary/h4.stdout.json
          python - <<'PY'
          import json
          road = json.load(open('build/v3/summary/road.json'))
          h4 = json.load(open('build/v3/summary/h4.json'))
          assert road['all_exact'] and h4['all_exact']
          assert road['internal_fallback_fraction'] == 0.0
          assert h4['internal_fallback_fraction'] == 0.0
          print('ROAD mean=', road['mean_regret'], 'p95=', road['p95_regret'],
                'max=', road['max_regret'], 'wrong=', road['wrong_arm_rate'],
                'decision_us=', road['mean_decision_us'])
          print('H4 mean=', h4['mean_regret'], 'p95=', h4['p95_regret'],
                'max=', h4['max_regret'], 'wrong=', h4['wrong_arm_rate'],
                'decision_us=', h4['mean_decision_us'])
          # Same development-only gates. No gate is weakened and H6 is untouched.
          assert road['mean_regret'] <= 0.08, road
          assert road['p95_regret'] <= 0.40, road
          assert road['wrong_arm_rate'] <= 0.10, road
          assert h4['mean_regret'] <= 0.10, h4
          assert h4['p95_regret'] <= 0.50, h4
          assert h4['wrong_arm_rate'] <= 0.12, h4
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bfs-selector-v3-light3-reachfix-development
          path: build/v3/
          retention-days: 90