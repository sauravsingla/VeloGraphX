name: External RisGraph Baseline

on:
  push:
    paths:
      - '.github/workflows/external-risgraph-baseline.yml'
      - 'benchmarks/external_risgraph_bfs.cpp'
      - 'tools/prepare_risgraph_compat.py'
      - 'include/velographx/incremental/bfs.hpp'
      - 'include/velographx/storage/**'
      - 'tools/normalize_edge_list.py'
      - 'datasets/manifest.public-small.json'
      - 'CMakeLists.txt'
  workflow_dispatch:

jobs:
  matched-bfs:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      RISGRAPH_SHA: 4e77f774d4aa7cd0bf3011e713496573b70c91ab
      IMPORTED_RATE: '0.99'
      BATCH_SIZE: '4096'
      ROOT: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned-system build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libaio-dev libboost-fiber-dev libtbb-dev pkg-config

      - name: Build VeloGraphX matched harness
        run: |
          cmake -S . -B build/cmake -DCMAKE_BUILD_TYPE=Release -DVELOGRAPHX_BUILD_TESTS=OFF -DVELOGRAPHX_BUILD_BENCHMARKS=ON
          cmake --build build/cmake --target velographx_external_risgraph_bfs -j 2

      - name: Checkout immutable RisGraph and record compatibility
        run: |
          git clone --filter=blob:none https://github.com/thu-pacman/RisGraph.git build/risgraph
          git -C build/risgraph checkout --detach "$RISGRAPH_SHA"
          git -C build/risgraph submodule update --init --recursive
          test "$(git -C build/risgraph rev-parse HEAD)" = "$RISGRAPH_SHA"
          grep -q 'Apache License' build/risgraph/LICENSE
          python tools/prepare_risgraph_compat.py --risgraph build/risgraph --output-dir build/external-risgraph
          python - <<'PY'
          import json
          m=json.load(open('build/external-risgraph/compatibility-manifest.json'))
          assert m['risgraph_revision']=='4e77f774d4aa7cd0bf3011e713496573b70c91ab'
          assert m['algorithm_implementation_modified'] is False
          assert m['compatibility_source_modified'] is True
          assert len(m['changes'])==3
          PY

      - name: Build official RisGraph batch BFS
        run: |
          cmake -S build/risgraph -B build/risgraph-build -DCMAKE_BUILD_TYPE=Release
          cmake --build build/risgraph-build --target bfs_inc_batch convert_to_binary -j 2

      - name: Acquire checksum-pinned web-Google
        run: |
          mkdir -p build/external-risgraph/source
          EXPECTED_SHA=8c0f453f1eb1e24ad145e36e542b129083237e96e585abae768927bdb70167d1
          TARGET=build/external-risgraph/source/web-Google.txt
          if ! timeout 120s python tools/prepare_dataset.py --manifest datasets/manifest.public-small.json --output-dir build/external-risgraph/source --dataset web-Google > build/external-risgraph/dataset-prepared.json; then
            echo "Pinned GitHub source did not complete in 120s; trying canonical SNAP source"
            rm -f "$TARGET" build/external-risgraph/dataset-prepared.json build/external-risgraph/web-Google.txt.gz
            curl --fail --location --retry 3 --retry-delay 2 --connect-timeout 15 --max-time 240 \
              https://snap.stanford.edu/data/web-Google.txt.gz \
              -o build/external-risgraph/web-Google.txt.gz
            gzip -dc build/external-risgraph/web-Google.txt.gz > "$TARGET"
            echo "$EXPECTED_SHA  $TARGET" | sha256sum -c -
            python - <<'PY'
          import json
          from pathlib import Path
          Path('build/external-risgraph/dataset-prepared.json').write_text(json.dumps({
            'schema_version':1,
            'prepared':[{
              'name':'web-Google',
              'path':'build/external-risgraph/source/web-Google.txt',
              'sha256':'8c0f453f1eb1e24ad145e36e542b129083237e96e585abae768927bdb70167d1',
              'format':'edge-list-text','directed':True,'weighted':False,
              'acquisition_source':'https://snap.stanford.edu/data/web-Google.txt.gz'
            }]
          },sort_keys=True)+'\n')
          PY
          fi
          echo "$EXPECTED_SHA  $TARGET" | sha256sum -c -
          python tools/normalize_edge_list.py --input "$TARGET" --output build/external-risgraph/web-Google-normalized.txt --report build/external-risgraph/normalization.json --directed
          python - <<'PY'
          import json
          n=json.load(open('build/external-risgraph/normalization.json'))
          assert n['vertex_count']==875713
          assert n['edge_count']==5105039
          assert n['source_sha256']=='8c0f453f1eb1e24ad145e36e542b129083237e96e585abae768927bdb70167d1'
          PY
          build/risgraph-build/convert_to_binary < build/external-risgraph/web-Google-normalized.txt > build/external-risgraph/web-Google.bin

      - name: Capture environment
        run: |
          python tools/capture_benchmark_environment.py --label external-risgraph-web-google --output build/external-risgraph/environment.json
          lscpu > build/external-risgraph/lscpu.txt
          {
            echo "velographx_sha=$(git rev-parse HEAD)"
            echo "risgraph_sha=$RISGRAPH_SHA"
            echo "risgraph_algorithm_implementation_modified=false"
            echo "risgraph_compatibility_source_modified=true"
            echo "imported_rate=$IMPORTED_RATE"
            echo "batch_size=$BATCH_SIZE"
            echo "root=$ROOT"
          } > build/external-risgraph/pins.txt

      - name: Run VeloGraphX deletion-aware and legacy policies
        run: |
          build/cmake/velographx_external_risgraph_bfs build/external-risgraph/web-Google-normalized.txt "$ROOT" "$IMPORTED_RATE" "$BATCH_SIZE" > build/external-risgraph/velographx.json
          python - <<'PY'
          import json
          r=json.load(open('build/external-risgraph/velographx.json'))
          assert r['schema_version']==2
          assert r['correct'] is True and r['legacy_correct'] is True
          assert r['vertices']==875713 and r['source_edges']==5105039
          assert r['final_edges']==r['initial_edges'] and r['batches']>0
          assert r['deletion_candidates']>=0 and r['affected_vertices']>=0
          assert r['full_recompute_batches']<=r['batches']
          assert r['legacy_full_recompute_wall_us']>0
          PY

      - name: Run official RisGraph
        env:
          OMP_PROC_BIND: 'true'
        run: |
          build/risgraph-build/bfs_inc_batch build/external-risgraph/web-Google.bin "$ROOT" "$IMPORTED_RATE" "$BATCH_SIZE" > build/external-risgraph/risgraph.stdout 2> build/external-risgraph/risgraph.stderr
          grep -q 'wall_mean =' build/external-risgraph/risgraph.stderr

      - name: Validate exact cross-system result and summarize
        run: |
          python - <<'PY'
          import json,re
          from pathlib import Path
          vx=json.load(open('build/external-risgraph/velographx.json'))
          compat=json.load(open('build/external-risgraph/compatibility-manifest.json'))
          stdout=[x.strip() for x in Path('build/external-risgraph/risgraph.stdout').read_text().splitlines() if x.strip()]
          stderr=Path('build/external-risgraph/risgraph.stderr').read_text()
          assert len(stdout)>=2
          layers=lambda line:[int(x) for x in line.split()]
          rg_inc,rg_full=layers(stdout[-2]),layers(stdout[-1])
          assert rg_inc==rg_full
          assert vx['layer_counts']==rg_full
          mean=re.search(r'wall_mean = ([0-9.eE+-]+) us',stderr)
          total=re.search(r'wall_times = ([0-9.eE+-]+) us',stderr)
          visited=re.findall(r'0 visited vertices: ([0-9]+)',stderr)
          assert mean and total and visited
          rg_mean=float(mean.group(1)); rg_total=float(total.group(1))
          result={
            'schema_version':2,'artifact_type':'velographx-external-risgraph-baseline',
            'dataset':'web-Google','dataset_vertices':875713,'dataset_edges':5105039,'directed':True,
            'root':int(vx['root']),'imported_rate':vx['imported_rate'],'batch_size':vx['batch_size'],'batches':vx['batches'],
            'initial_edges':vx['initial_edges'],'final_edges':vx['final_edges'],
            'update_semantics':'per batch: add next window edges, remove equally many oldest window edges, then maintain exact BFS',
            'velographx_deletion_policy':'pre-batch shortest-path-DAG support invalidation, boundary repair, final-state insertion relaxation, and 35% affected-region fallback',
            'legacy_velographx_policy':'full BFS recomputation after every deletion-containing batch',
            'deletion_candidates':vx['deletion_candidates'],'affected_vertices':vx['affected_vertices'],
            'full_recompute_batches':vx['full_recompute_batches'],
            'legacy_full_recompute_wall_mean_us':vx['legacy_full_recompute_mean_us'],
            'deletion_repair_speedup_over_legacy':vx['deletion_repair_speedup_over_legacy'],
            'risgraph_revision':'4e77f774d4aa7cd0bf3011e713496573b70c91ab','risgraph_program':'official bfs_inc_batch',
            'risgraph_algorithm_implementation_modified':False,'build_compatibility_manifest':compat,
            'velographx_wall_mean_us':vx['wall_mean_us'],'risgraph_wall_mean_us':rg_mean,
            'velographx_wall_total_us':vx['wall_us'],'risgraph_wall_total_us':rg_total,
            'latency_ratio_velographx_over_risgraph':vx['wall_mean_us']/rg_mean if rg_mean else None,
            'visited_vertices':int(visited[-1]),'layer_counts':rg_full,
            'velographx_correct_against_independent_full_bfs':True,
            'legacy_velographx_correct_against_independent_full_bfs':True,
            'risgraph_incremental_equals_risgraph_full_recompute':True,'cross_system_layer_histogram_equal':True,
            'research_claim':False,'hosted_ci_single_execution':True
          }
          Path('build/external-risgraph/summary.json').write_text(json.dumps(result,indent=2,sort_keys=True)+'\n')
          print(json.dumps(result,sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: velographx-external-risgraph-web-google
          path: |
            build/external-risgraph/dataset-prepared.json
            build/external-risgraph/normalization.json
            build/external-risgraph/environment.json
            build/external-risgraph/lscpu.txt
            build/external-risgraph/pins.txt
            build/external-risgraph/FindTBB.upstream.cmake
            build/external-risgraph/FindTBB.compat.cmake
            build/external-risgraph/risgraph-build-compat.patch
            build/external-risgraph/abseil-gcc-compat.patch
            build/external-risgraph/compatibility-manifest.json
            build/external-risgraph/velographx.json
            build/external-risgraph/risgraph.stdout
            build/external-risgraph/risgraph.stderr
            build/external-risgraph/summary.json
          retention-days: 90
