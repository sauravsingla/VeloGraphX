name: Capacity Dispatch Probe

on:
  push:
    paths:
      - '.github/workflows/capacity-dispatch-once.yml'

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch dedicated capacity campaign once
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail-with-body -sS \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/dedicated-capacity-campaign.yml/dispatches \
            -d '{"ref":"main","inputs":{"run_dedicated":"true","scales":"16,18,20,22,24,26","edgefactor":"16","seed":"1"}}'
          echo 'Dedicated capacity workflow dispatched.'
