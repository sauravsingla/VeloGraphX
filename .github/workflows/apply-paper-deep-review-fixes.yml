}
'''
          for key in ('ramalingam1996incremental', 'macko2015llama', 'dhulipala2019aspen', 'zhu2020livegraph', 'fuchs2022sortledton'):
              if f'{{{key},' in bib:
                  raise RuntimeError(f'bibliography key already exists unexpectedly: {key}')
          p.write_text(bib + additions)

          # ------------------------------------------------------------------
          # Figure generator: do not plot disabled fallback as selector evidence;
          # add a real system overview figure.
          # ------------------------------------------------------------------
          p = Path('paper/figures/generate_figures.py')
          fig = p.read_text()
          fig = replace_once(fig, 'import matplotlib.pyplot as plt', 'import matplotlib.pyplot as plt\nfrom matplotlib.patches import FancyArrowPatch, FancyBboxPatch', 'figure patch imports')
          fig = replace_once(
              fig,
              '    explicit full selections, and internal fallback. This makes a large tail visibly\n    different from a frequent-but-cheap crossover error.',
              '    and explicit full selections. Internal fallback is intentionally disabled in the\n    publication policy-comparison harness, so it is not plotted as selector evidence.',
              'figure docstring',
          )
          fig = replace_once(fig, '    fallback = [100.0 * r["internal_fallback_fraction"] for r in ordered]\n', '', 'remove fallback series')
          fig = replace_once(
              fig,
              '    ax_choice.plot(x, fallback, marker="x", linestyle="--", label="Internal fallback rate")\n',
              '',
              'remove fallback plot',
          )
          fig = replace_once(fig, '    ax_choice.legend(ncol=3, fontsize=8)', '    ax_choice.legend(ncol=2, fontsize=8)', 'selector legend')

          architecture_func = r'''

def system_overview_figure():
    """Architecture overview for the paper's physical-plan framing."""
    fig, ax = plt.subplots(figsize=(9.2, 3.4))
    ax.set_xlim(0, 1)
    ax.set_ylim(0, 1)
    ax.axis("off")

    def box(x, y, w, h, title, subtitle=""):
        patch = FancyBboxPatch((x, y), w, h, boxstyle="round,pad=0.012", fill=False)
        ax.add_patch(patch)
        ax.text(x + w / 2, y + h * 0.62, title, ha="center", va="center", fontsize=10, weight="bold")
        if subtitle:
            ax.text(x + w / 2, y + h * 0.28, subtitle, ha="center", va="center", fontsize=8)
        return (x, y, w, h)

    def arrow(x1, y1, x2, y2, label=""):
        ax.add_patch(FancyArrowPatch((x1, y1), (x2, y2), arrowstyle="->", mutation_scale=12))
        if label:
            ax.text((x1 + x2) / 2, (y1 + y2) / 2 + 0.035, label, ha="center", va="bottom", fontsize=7.5)

    box(0.02, 0.55, 0.12, 0.22, "Update batch", "insertions + deletions")
    box(0.19, 0.50, 0.18, 0.32, "Mutable graph substrate", "segmented CSR + deltas\nrow patches + reverse adjacency")
    box(0.42, 0.55, 0.15, 0.22, "Pre-repair selector", "structure + recent arm cost")
    box(0.63, 0.70, 0.14, 0.18, "Localized repair", "exact maintained state")
    box(0.63, 0.40, 0.14, 0.18, "Full recompute", "exact fresh result")
    box(0.83, 0.55, 0.14, 0.22, "Exact result", "same logical answer")
    box(0.42, 0.12, 0.15, 0.18, "Telemetry", "cost, affected work, reason")
    box(0.19, 0.12, 0.18, 0.18, "Bounded consolidation", "explicit global storage work")

    arrow(0.14, 0.66, 0.19, 0.66)
