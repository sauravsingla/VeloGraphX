name: Apply deep paper review fixes

on:
  push:
    branches: [paper-deep-review-fixes]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: paper-deep-review-fixes
          fetch-depth: 0

      - name: Apply reviewer-driven manuscript and build fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          import re

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"{label}: expected exactly one match, found {count}")
              return text.replace(old, new, 1)

          # ------------------------------------------------------------------
          # Canonical manuscript
          # ------------------------------------------------------------------
          p = Path('paper/manuscript.md')
          text = p.read_text()

          abstract = '''Graph analytics systems increasingly operate on graphs that change continuously, yet exact maintenance is often committed in advance to either incremental repair or full recomputation. Neither execution mode dominates: localized repair can avoid most graph work when updates have limited structural impact, while recomputation can win once dependency discovery and repair become broad.

We present **VeloGraphX**, a C++20 system that treats localized repair and full recomputation as competing exact physical plans over one mutable graph substrate. The substrate combines segmented CSR, packed mutable deltas, sparse row patches, and forward/reverse adjacency. For dynamic BFS, VeloGraphX normalizes a batch to final edge states, identifies deleted shortest-path support before mutation, repairs invalidated state from valid boundary predecessors, propagates insertion-induced decreases, and retains conservative recomputation as a semantic safety mechanism. A separate pre-repair selector uses only pre-execution structural signals and prior measured arm costs to choose a plan before repair begins.

On a checksum-pinned three-graph validation covering nine regimes, 45 graph-regime repetitions, and 1,610 sequential batch observations, every output is exact. Equal-regime mean oracle regret is **3.94%**, versus **11.19%** for always-incremental, **17.84%** for a simple update-density threshold, and **20.21%** for a history-only cost model; sample-weighted regret is 2.31%, and selector decision cost is about 0.286 µs. The largest web-Google regime remains a visible tail at 17.48% mean regret. External results also reverse by workload: VeloGraphX is about 1.38× faster than NetworKit on the evaluated web-Google workload, while NetworKit is about 1.35× faster on ca-GrQc; a separate accepted RisGraph campaign is retained where RisGraph is faster.

The result is deliberately narrower than universal system superiority: exact dynamic analytics benefits from exposing repair and recomputation as observable, selectable physical plans whose preferred choice changes with graph and update regime.'''
          text, n = re.subn(
              r"## Abstract\n.*?\n## 1\. Introduction",
              "## Abstract\n\n" + abstract + "\n\n## 1. Introduction",
              text,
              count=1,
              flags=re.S,
          )
          if n != 1:
              raise RuntimeError(f'abstract: expected one replacement, found {n}')

          correctness = '''### 3.9 Correctness argument

The repair procedure is exact for the normalized final state of a batch. It is useful to separate a mixed batch into an intermediate graph containing the final deletions but not yet the final additions, followed by insertion relaxation.

**Lemma 1 — unaffected old distances remain exact after deletions.** Consider a reachable vertex whose old distance is `d`. The invalidation closure marks the vertex affected exactly when every old shortest-parent support is removed directly by the batch or transitively through an affected predecessor. If the vertex is not affected, at least one old shortest parent remains valid. Induction on `d` therefore gives a surviving source-to-vertex path of length `d`. Deletions cannot create a shorter path, so the old distance remains exact in the deletion-only intermediate graph.

**Lemma 2 — boundary repair computes exact distances for affected vertices.** All affected vertices are first set to unreachable. The repair seeds each affected vertex with the best distance offered by an unaffected valid predecessor and then processes affected-to-affected relaxations in nondecreasing tentative-distance order. This is Dijkstra/BFS relaxation on the affected subgraph with exact boundary distances from Lemma 1. Consequently each affected vertex receives its exact shortest distance in the deletion-only intermediate graph, or remains unreachable when no boundary path exists.

**Lemma 3 — insertion propagation restores exact post-batch distances.** Insertions cannot increase any distance. After deletion repair, each final inserted edge is relaxed from the exact intermediate distances, and every successful decrease is propagated through outgoing adjacency until no relaxation remains. Standard unweighted shortest-path relaxation then yields the exact distances in the final post-batch graph, including newly reachable vertices.

**Theorem 1 — exact batched BFS maintenance.** Batch normalization preserves only the final desired state of each logical edge. Lemmas 1–3 establish exactness when localized repair completes. If the affected-set bound is exceeded, VeloGraphX instead runs a fresh exact BFS. Thus `apply()` returns the same distance vector as exact recomputation after every normalized batch; plan selection affects only cost, never semantics.

### 3.10 System boundary beyond BFS'''
          text = replace_once(text, '### 3.9 System boundary beyond BFS', correctness, 'correctness insertion')

          workload_anchor = 'Machine-readable artifacts record environment and timing semantics.\n\nHosted CI is used as reproducible comparative evidence when alternatives execute under the same documented envelope.'
          workload_repl = '''Machine-readable artifacts record environment and timing semantics.

The primary selector workload is a **deterministic source-order sliding window**, not a claim of a naturally timestamped temporal trace. After the checksum-pinned imported prefix, each measured batch adds the next edges in the retained source order and removes the corresponding oldest edges from the active window. Source order, import fraction, root, and batch size are therefore part of the benchmark definition. This construction gives repeatable mixed insertion/deletion churn while keeping temporal realism outside the claim boundary.

Hosted CI is used as reproducible comparative evidence when alternatives execute under the same documented envelope.'''
          text = replace_once(text, workload_anchor, workload_repl, 'workload disclosure')

          stats_anchor = 'Averages do not replace per-dataset or per-regime results when winner reversals occur.\n\nThe adaptive-policy experiments execute both exact arms in the publication harness so the offline oracle is measured rather than modeled.'
          stats_repl = '''Averages do not replace per-dataset or per-regime results when winner reversals occur.

The 1,610 primary selector measurements are **sequential batch observations from 45 graph-regime repetitions**, not 1,610 independent experimental trials. We therefore use the mean across the nine regimes as the primary cross-regime summary and report the sample-weighted mean separately; the latter gives more weight to small batches because they produce more observations. Tail percentiles are descriptive rather than inferential confidence bounds. In particular, the largest web-Google regime contributes 15 batch observations across five repetitions, so its p95 value is reported together with its mean, wrong-arm rate, and maximum rather than treated as a precise population percentile.

The adaptive-policy experiments execute both exact arms in the publication harness so the offline oracle is measured rather than modeled.'''
          text = replace_once(text, stats_anchor, stats_repl, 'statistics disclosure')

          selector_intro = 'It evaluates checksum-pinned `ca-GrQc`, `soc-Epinions1`, and `web-Google`, one fixed root per graph, three batch regimes per graph, five repetitions per regime, and one thread.'
          selector_intro_repl = selector_intro + '''

For this policy-comparison harness, the incremental arm is deliberately constructed with a deletion fallback fraction of **2.0**. Because an affected set cannot exceed the graph vertex count, this disables the ordinary 0.35 internal fallback and keeps `always_incremental` and `always_full` as clean experimental arms. The resulting zero internal-fallback count is therefore a property of arm isolation, **not evidence that the selector prevented fallback**. The production/default incremental BFS continues to use the 0.35 safety bound.'''
          text = replace_once(text, selector_intro, selector_intro_repl, 'fallback isolation disclosure')

          old_metric = 'The current selector records **3.939% mean oracle regret across regimes**, **2.309% sample-weighted mean regret**, a **1.739% sample-weighted wrong-arm rate**, **zero internal full fallbacks**, and about **0.286 µs sample-weighted decision cost**.'
          new_metric = 'The current selector records **3.939% mean oracle regret across regimes**, **2.309% sample-weighted mean regret**, a **1.739% sample-weighted wrong-arm rate**, and about **0.286 µs sample-weighted decision cost**.'
          text = replace_once(text, old_metric, new_metric, 'selector metric interpretation')

          old_fallback_para = '''Zero internal fallbacks across the current-policy validation is also significant for the architecture. The adaptive path is not achieving low average regret by repeatedly entering incremental repair and then escaping to full BFS. Full executions recorded by the policy are explicit pre-repair choices. This separates selector quality from the incremental algorithm's 35% safety fallback and shows that the measured current-policy path avoids that particular form of double work on these experiments.'''
          new_fallback_para = '''Internal fallback is intentionally disabled in this policy-comparison harness so that repair and recomputation remain separable oracle arms. Consequently, the zero fallback count is not used as a selector-quality metric. The experiment establishes pre-repair plan quality under isolated exact arms; a separate run with the production 0.35 affected-set bound is required to quantify how often pre-repair selection avoids repair-discovery-then-full double work in deployment.'''
          text = replace_once(text, old_fallback_para, new_fallback_para, 'fallback discussion')

          policy_section = '''### 6.3 Policy baselines under one frozen harness

The retained cross-dataset artifact also contains all policies under the **same graph, root, batch, repetition, timing, and exactness contract**. Equal weighting across the nine regimes is important because small batches generate many more sequential observations than large batches. Under that equal-regime summary, always-incremental has 11.19% mean regret, the simple update-density threshold 17.84%, the history-only cost model 20.21%, and the current adaptive policy 3.94%. Their worst-regime mean regrets are 57.10%, 59.29%, 57.56%, and 17.48%, respectively.

The sample-weighted view deliberately tells a different story: always-incremental records 1.36% sample-weighted regret versus 2.31% for adaptive because the observation count is dominated by repair-friendly small-batch regimes. We retain that inversion rather than choosing only the favorable aggregate. The adaptive result is therefore best interpreted as **more robust across regimes**, not uniformly better under every possible weighting of the same observations. `always_full` remains an exact oracle arm but is omitted from this policy-baseline summary because it is intentionally poor in strongly repair-favorable regimes.

### 6.4 Dynamic BFS external baselines'''
          text = replace_once(text, '### 6.3 Dynamic BFS versus NetworKit', policy_section, 'policy baseline section')
          text = replace_once(text, '### 6.4 Static BFS and SSSP versus GAP and LAGraph', '### 6.5 Static BFS and SSSP versus GAP and LAGraph', 'renumber static')
          text = replace_once(text, '### 6.5 Exact dynamic triangles versus a published exact reference', '### 6.6 Exact dynamic triangles versus a published exact reference', 'renumber triangles')
          text = replace_once(text, '### 6.6 Large-graph storage maintenance', '### 6.7 Large-graph storage maintenance', 'renumber storage')
          text = replace_once(text, '### 6.7 Supporting breadth and maturity', '### 6.8 Supporting breadth and maturity', 'renumber breadth')

          nk_close = 'The reversal is important: external-system conclusions are workload-specific. It also aligns with the paper\'s central premise that graph/update structure affects which execution machinery pays off. We do not generalize these two datasets to universal superiority.'
          ris_para = nk_close + '''

A separate accepted same-run web-Google campaign compares VeloGraphX with pinned official RisGraph under its exact incremental-BFS batch contract: 99% initial import, 4,096-edge batches, deterministic root 481807, 13 batches, and one thread. VeloGraphX localized repair averages 59.658 ms per answer-ready batch versus 31.333 ms for RisGraph, so **RisGraph is about 1.90× faster** on this workload. VeloGraphX repair is nevertheless about 1.98× faster than its own legacy 118.039 ms full-recompute path. This campaign is separate from the NetworKit campaign; its absolute times are never merged into a synthetic three-system ranking.'''
          text = replace_once(text, nk_close, ris_para, 'RisGraph evaluation')

          old_double_work = '''A selector that invokes incremental repair and only later discovers that the affected region is too large may pay twice: once for repair discovery or partial processing and again for full recomputation. This motivates pre-execution signals and selector-owned recomputation. The current publication-policy artifacts show zero internal fallbacks in the evaluated current-policy runs, so the policy is avoiding that specific double-work path there; the remaining error is mostly choosing the slower exact arm directly.'''
          new_double_work = '''A selector that invokes incremental repair and only later discovers that the affected region is too large may pay twice: once for repair discovery or partial processing and again for full recomputation. This motivates pre-execution signals and selector-owned recomputation. The current publication-policy harness intentionally disables internal fallback to isolate the repair and full arms, so it does **not** by itself measure avoided repair-then-full work. Demonstrating that deployment effect requires a separate production-bound (0.35) experiment; the current result is specifically a plan-selection result.'''
          text = replace_once(text, old_double_work, new_double_work, 'double-work claim boundary')

          graphbolt_para = '''GraphBolt and DZiG develop dependency-driven and sparsity-aware incremental graph processing. Their work motivates exploiting only affected state rather than rerunning a whole computation. VeloGraphX's BFS repair likewise uses dependency structure, but the paper's focus is on when to expose that repair as one physical arm versus choosing recomputation before repair begins.'''
          graphbolt_repl = graphbolt_para + '''

Exact incremental shortest-path maintenance also long predates this system. Ramalingam and Reps handle heterogeneous graph modifications for incremental shortest paths. VeloGraphX therefore does not claim the existence of exact dynamic shortest-path repair as new; its contribution is the systems integration of exact repair with an explicit recomputation arm, pre-repair plan selection, mutable storage, and plan-quality telemetry.'''
          text = replace_once(text, graphbolt_para, graphbolt_repl, 'dynamic shortest-path prior work')

          old_storage_rw = '''Dynamic storage itself is not claimed as novel. GraphOne uses a hybrid representation supporting graph updates and analytical views, while Teseo develops a sophisticated mutable graph representation with transactional support. VeloGraphX's segmented CSR, packed deltas, and sparse row patches should be read as the substrate required to make repeated exact repair and explicit consolidation practical, not as a claim to have invented mutable graph storage.'''
          new_storage_rw = '''Dynamic storage itself is not claimed as novel. LLAMA augments CSR with multiversioned arrays for mutable analytical snapshots; Aspen uses compressed purely-functional trees for graph streaming; LiveGraph combines transactional updates with sequential adjacency scans; and Sortledton targets transactional dynamic graph storage across multiple access patterns. GraphOne uses a hybrid representation supporting graph updates and analytical views, while Teseo develops a sophisticated mutable representation with transactional support. VeloGraphX's segmented CSR, packed deltas, and sparse row patches should therefore be read as the substrate required to make repeated exact repair and explicit consolidation practical, not as a claim to have invented mutable graph storage.'''
          text = replace_once(text, old_storage_rw, new_storage_rw, 'storage related work')

          limitations_anchor = '''The current policy's three-graph validation uses a historical fixed graph/root program rather than a newly preregistered unseen holdout. Its average regret is low, but the largest `web-Google` regime has a material tail; the paper therefore does not claim uniform near-oracle behavior.'''
          limitations_repl = '''The current policy's three-graph validation uses a historical fixed graph/root program rather than a newly preregistered unseen holdout. Its workload is a deterministic source-order sliding window rather than a timestamped temporal trace, and its policy-comparison harness disables internal fallback to isolate the exact arms. Its average regret is low, but the largest `web-Google` regime has a material tail; the paper therefore does not claim uniform near-oracle behavior or that this experiment measures deployment fallback avoidance.'''
          text = replace_once(text, limitations_anchor, limitations_repl, 'limitations scope')

          p.write_text(text)

          # ------------------------------------------------------------------
          # Machine-readable evidence registry: disclose harness semantics and
          # add policy baselines derived from the already retained artifact.
          # ------------------------------------------------------------------
          p = Path('paper/data/accepted-results.json')
          data = json.loads(p.read_text())
          cv = data['adaptive_selector']['cross_dataset_validation']
          cv['graph_regime_repetitions'] = 45
          cv['batch_observations_are_independent_trials'] = False
          cv['policy_arm_fallback_fraction'] = 2.0
          cv['internal_fallback_disabled_for_arm_isolation'] = True
          cv['internal_fallback_interpretation'] = 'Zero internal fallbacks are expected because the publication policy harness uses fallback fraction 2.0 to isolate repair and full exact arms; this count is not selector-quality evidence.'
          cv['workload_model'] = 'deterministic source-order sliding window: add next retained-stream edges and remove corresponding oldest active-window edges'
          cv['selector_feature_semantics'] = {
              'reachable_fraction': 'initial reachable fraction, reused across batches in the current publication harness',
              'shallow_parent_deletion_fraction': 'first-batch cold-start preflight feature in the current publication harness'
          }
          cv['dataset_workload'] = {
              'ca-GrQc': {'vertices': 5242, 'stream_edges': 28968, 'root': 1974, 'import_rate': 0.75, 'batch_sizes': [96, 384, 1536]},
              'soc-Epinions1': {'vertices': 75879, 'stream_edges': 508837, 'root': 71391, 'import_rate': 0.99, 'batch_sizes': [384, 1536, 6144]},
              'web-Google': {'vertices': 875713, 'stream_edges': 5105039, 'root': 391806, 'import_rate': 0.99, 'batch_sizes': [1536, 6144, 24576]}
          }
          cv['policy_baseline_summary'] = {
              'always_incremental': {
                  'mean_regret_across_regimes': 0.11194569997765644,
                  'sample_weighted_mean_regret': 0.013624730221282555,
                  'sample_weighted_wrong_arm_rate': 0.034161490683229814,
                  'worst_regime_mean_regret': 0.5709730684187061
              },
              'simple_threshold': {
                  'mean_regret_across_regimes': 0.17839289936481844,
                  'sample_weighted_mean_regret': 0.07863034518009784,
                  'sample_weighted_wrong_arm_rate': 0.08385093167701864,
                  'worst_regime_mean_regret': 0.5929352495043947
              },
              'history_cost_model': {
                  'mean_regret_across_regimes': 0.2020629594668111,
                  'sample_weighted_mean_regret': 0.11517914215718278,
                  'sample_weighted_wrong_arm_rate': 0.05590062111801243,
                  'worst_regime_mean_regret': 0.5755926355292179
              },
              'adaptive': {
                  'mean_regret_across_regimes': cv['mean_oracle_regret_across_regimes'],
                  'sample_weighted_mean_regret': cv['sample_weighted_mean_oracle_regret'],
                  'sample_weighted_wrong_arm_rate': cv['sample_weighted_wrong_arm_rate'],
                  'worst_regime_mean_regret': cv['worst_regime_mean_regret']
              }
          }
          rg = data['external_baselines']['risgraph_dynamic_bfs']
          rg.update({
              'threads': 1,
              'root': 481807,
              'batches': 13,
              'batch_size': 4096,
              'initial_import_rate': 0.99,
              'velographx_localized_repair_mean_ms': 59.658,
              'velographx_legacy_full_mean_ms': 118.039,
              'risgraph_mean_ms': 31.333,
              'risgraph_faster_than_velographx_ratio': 59.658 / 31.333,
              'velographx_repair_faster_than_legacy_ratio': 118.039 / 59.658,
              'all_exact': True
          })
          p.write_text(json.dumps(data, indent=2) + '\n')

          # ------------------------------------------------------------------
          # Results ledger: align claim boundaries with actual harness semantics.
          # ------------------------------------------------------------------
          p = Path('paper/results-ledger.md')
          ledger = p.read_text()
          ledger = replace_once(
              ledger,
              '| Internal full fallbacks | 0 |',
              '| Internal full fallbacks in arm-isolation harness | 0 (fallback fraction 2.0) |',
              'ledger fallback row',
          )
          tail_anchor = 'Per-regime adaptive values are retained in [`data/current-selector-regimes.csv`](data/current-selector-regimes.csv).'
          policy_note = tail_anchor + '''

**Fallback interpretation:** the publication policy harness constructs the incremental arm with fallback fraction 2.0 so repair and full recomputation remain separable exact arms. Zero internal fallback is therefore expected by construction and is not used as evidence that the selector avoids production fallback.

### Same-harness policy baselines

The retained cross-dataset artifact also contains policy baselines under the identical nine-regime contract:

| Policy | Equal-regime mean regret | Sample-weighted regret | Wrong-arm rate | Worst-regime mean regret |
| --- | ---: | ---: | ---: | ---: |
| always-incremental | 11.19% | **1.36%** | 3.42% | 57.10% |
| simple threshold | 17.84% | 7.86% | 8.39% | 59.29% |
| history-only cost model | 20.21% | 11.52% | 5.59% | 57.56% |
| current adaptive | **3.94%** | 2.31% | **1.74%** | **17.48%** |

The lower sample-weighted regret of always-incremental is retained explicitly: small repair-friendly regimes produce more batch observations. Equal-regime mean and worst-regime mean are therefore the primary robustness summaries.'''
          ledger = replace_once(ledger, tail_anchor, policy_note, 'ledger policy baselines')
          old_rg = '| VeloGraphX vs RisGraph | `33286241439` | `9724535579` | Localized VeloGraphX repair improves materially over legacy full-recompute policy; RisGraph remains faster on the evaluated `web-Google` workload | Separate run from NetworKit; never combine absolute times into a three-system ranking |'
          new_rg = '| VeloGraphX vs RisGraph | `33286241439` | `9724535579` | `web-Google`: RisGraph ≈1.90× faster than VeloGraphX; VeloGraphX repair ≈1.98× faster than its legacy full-recompute path | Separate run from NetworKit; never combine absolute times into a three-system ranking |'
          ledger = replace_once(ledger, old_rg, new_rg, 'ledger RisGraph numeric')
          stats_rule = '- Report sample count/repetitions in captions.'
          stats_rule_repl = stats_rule + '\n- Treat sequential batch samples as observations nested inside graph-regime repetitions; do not present 1,610 batches as independent trials.'
          ledger = replace_once(ledger, stats_rule, stats_rule_repl, 'ledger nested observations')
          p.write_text(ledger)

          # ------------------------------------------------------------------
          # Bibliography expansion for dynamic storage and exact dynamic paths.
          # ------------------------------------------------------------------
          p = Path('paper/references.bib')
          bib = p.read_text().rstrip() + '\n\n'
          additions = r'''@article{ramalingam1996incremental,
  title   = {An Incremental Algorithm for a Generalization of the Shortest-Path Problem},
  author  = {Ramalingam, G. and Reps, Thomas W.},
  journal = {Journal of Algorithms},
  volume  = {21},
  number  = {2},
  pages   = {267--305},
  year    = {1996},
  doi     = {10.1006/jagm.1996.0046}
}

@inproceedings{macko2015llama,
  title     = {LLAMA: Efficient Graph Analytics Using Large Multiversioned Arrays},
  author    = {Macko, Peter and Marathe, Virendra J. and Margo, Daniel W. and Seltzer, Margo I.},
  booktitle = {2015 IEEE 31st International Conference on Data Engineering (ICDE)},
  pages     = {363--374},
