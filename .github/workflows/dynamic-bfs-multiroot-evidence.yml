name: Exact Dynamic BFS Multi-root Evidence

on:
  push:
    paths:
      - '.github/workflows/dynamic-bfs-multiroot-evidence.yml'
      - 'benchmarks/external_risgraph_bfs.cpp'
      - 'include/velographx/incremental/bfs.hpp'
      - 'include/velographx/storage/**'
      - 'tools/prepare_dataset.py'
      - 'tools/prepare_pinned_edge_stream.py'
      - 'tools/prepare_symmetric_pinned_edge_stream.py'
      - 'datasets/manifest.public-small.json'
  workflow_dispatch:

jobs:
  multiroot:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      OMP_NUM_THREADS: '1'
      OMP_PROC_BIND: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build

      - name: Build exact dynamic BFS harness
        run: |
          cmake -S . -B build/vx -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DVELOGRAPHX_BUILD_TESTS=OFF \
            -DVELOGRAPHX_BUILD_BENCHMARKS=ON
          cmake --build build/vx --target velographx_external_risgraph_bfs -j 2

      - name: Prepare checksum-pinned datasets
        run: |
          mkdir -p build/multiroot/datasets
          python tools/prepare_dataset.py --manifest datasets/manifest.public-small.json \
            --output-dir build/multiroot/datasets --dataset web-Google \
            > build/multiroot/web-Google-source.json
          python tools/prepare_dataset.py --manifest datasets/manifest.public-small.json \
            --output-dir build/multiroot/datasets --dataset ca-GrQc \
            > build/multiroot/ca-GrQc-source.json

          python tools/prepare_pinned_edge_stream.py \
            --input build/multiroot/datasets/web-Google.txt \
            --output build/multiroot/web-Google.txt \
            --report build/multiroot/web-Google-normalization.json \
            --expected-sha256 8c0f453f1eb1e24ad145e36e542b129083237e96e585abae768927bdb70167d1 \
            --expected-vertices 875713 \
            --expected-edges 5105039

          python tools/prepare_symmetric_pinned_edge_stream.py \
            --input build/multiroot/datasets/ca-GrQc.txt \
            --output build/multiroot/ca-GrQc.txt \
            --report build/multiroot/ca-GrQc-normalization.json \
            --expected-sha256 513efa8bb5c6d3d739797ca028d4a26a7df6bc20adcf3e722e18d1bcdb0e62d5 \
            --expected-vertices 5242 \
            --expected-source-rows 28980 \
            --expected-self-loops 12 \
            --expected-nonloop-pair-multiplicity 2 \
            --expected-unique-nonloop-pairs 14484

      - name: Select three deterministic reachability-screened roots per dataset
        run: |
          python - <<'PY'
          import json, subprocess
          from collections import Counter
          from pathlib import Path

          def edges(path):
              with open(path) as f:
                  for line in f:
                      if not line.strip() or line.startswith('#'):
                          continue
                      u,v=map(int,line.split()[:2])
                      yield u,v

          web=list(edges('build/multiroot/web-Google.txt'))
          web_n=int(len(web)*0.99)
          web_deg=Counter(u for u,_ in web[:web_n])
          web_candidates=[481807] + [u for u,_ in sorted(web_deg.items(), key=lambda kv:(-kv[1],kv[0]))]

          ca=list(edges('build/multiroot/ca-GrQc.txt'))
          width=int(len(ca)*0.75)
          initial=Counter(u for u,_ in ca[:width])
          final=Counter(u for u,_ in ca[len(ca)-width:])
          vertices=sorted(set(initial)|set(final))
          ca_ranked=sorted(vertices, key=lambda u:(-min(initial[u],final[u]),-(initial[u]+final[u]),u))
          ca_candidates=[4282] + ca_ranked

          configs={
              'web-Google':(web_candidates,0.99,4096,100000),
              'ca-GrQc':(ca_candidates,0.75,256,1000),
          }
          selected={}
          screens={}
          Path('build/multiroot/root-screen').mkdir(parents=True,exist_ok=True)
          for name,(candidates,rate,batch,min_reachable) in configs.items():
              picked=[]
              seen=set()
              records=[]
              for root in candidates:
                  if root in seen:
                      continue
                  seen.add(root)
                  out=Path(f'build/multiroot/root-screen/{name}-root-{root}.json')
                  with out.open('w') as f:
                      subprocess.run(['build/vx/velographx_external_risgraph_bfs',
                                      f'build/multiroot/{name}.txt',str(root),str(rate),str(batch)],
                                     stdout=f,check=True)
                  d=json.load(out.open())
                  exact=bool(d['correct'] and d['legacy_correct'])
                  reachable=int(d['visited_vertices'])
                  records.append({'root':root,'visited_vertices':reachable,'all_exact':exact})
                  if exact and reachable >= min_reachable:
                      picked.append(root)
                      if len(picked) == 3:
                          break
                  if len(records) >= 200 and len(picked) < 3:
                      raise RuntimeError(f'could not find three qualifying roots for {name}: {records[-5:]}')
              assert len(picked) == 3, (name,picked)
              selected[name]=picked
              screens[name]=records
          Path('build/multiroot/roots.json').write_text(json.dumps(selected,indent=2,sort_keys=True)+'\n')
          Path('build/multiroot/root-screen.json').write_text(json.dumps(screens,indent=2,sort_keys=True)+'\n')
          print(json.dumps(selected,sort_keys=True))
          PY

      - name: Run exact multi-root evidence
        run: |
          mkdir -p build/multiroot/runs
          python - <<'PY'
          import json, statistics, subprocess
          from pathlib import Path

          roots=json.load(open('build/multiroot/roots.json'))
          configs={
              'web-Google':(0.99,4096,100000),
              'ca-GrQc':(0.75,256,1000),
          }
          summary={'schema_version':2,'artifact_type':'velographx-exact-dynamic-bfs-multiroot','selection':'deterministic reachability-screened high-support roots','datasets':{}}
          for name,(rate,batch,min_reachable) in configs.items():
              rows=[]
              for root in roots[name]:
                  out=Path(f'build/multiroot/runs/{name}-root-{root}.json')
                  with out.open('w') as f:
                      subprocess.run(['build/vx/velographx_external_risgraph_bfs',
                                      f'build/multiroot/{name}.txt',str(root),str(rate),str(batch)],
                                     stdout=f,check=True)
                  d=json.load(out.open())
                  assert d['correct'] and d['legacy_correct'], (name,root)
                  assert d['visited_vertices'] >= min_reachable, (name,root,d['visited_vertices'])
                  rows.append({
                      'root':root,
                      'visited_vertices':d['visited_vertices'],
                      'batches':d['batches'],
                      'wall_mean_us':d['wall_mean_us'],
                      'affected_vertices_total':d.get('incremental_affected_vertices_total'),
                      'all_exact':True,
                  })
              summary['datasets'][name]={
                  'minimum_accepted_reachable_vertices':min_reachable,
                  'roots':rows,
                  'mean_of_root_mean_us':statistics.mean(r['wall_mean_us'] for r in rows),
                  'all_roots_exact':True,
              }
          Path('build/multiroot/summary.json').write_text(json.dumps(summary,indent=2,sort_keys=True)+'\n')
          print(json.dumps(summary,sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: exact-dynamic-bfs-multiroot
          path: build/multiroot/
          retention-days: 90
