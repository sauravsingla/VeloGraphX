name: Public Dataset Plan Contract
on:
  push:
  pull_request:

jobs:
  public-dataset-plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate planning artifact
        run: |
          mkdir -p build
          python tools/validate_public_dataset_plan.py datasets/public-research-plan.json > build/public-plan.json
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('build/public-plan.json').read_text())
          assert report['valid_plan'] is True
          assert report['execution_ready'] is False
          assert report['slot_count'] == 3
          assert report['incomplete_slots'] == ['100m-plus-public']
          PY
      - name: Fail closed when execution readiness is required
        run: |
          if python tools/validate_public_dataset_plan.py datasets/public-research-plan.json --require-ready 2> build/public-plan-ready.err; then
            echo 'unresolved public dataset plan unexpectedly marked execution-ready' >&2
            exit 1
          fi
          grep -Fqi 'not execution-ready' build/public-plan-ready.err
      - name: Validate competitor pin plan
        run: |
          python tools/validate_competitor_research_plan.py benchmarks/competitor-research-plan.json > build/competitor-plan.json
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('build/competitor-plan.json').read_text())
          assert report['valid'] is True
          assert report['competitor_count'] == 9
          assert report['ready_count'] == 6
          assert report['unresolved_count'] == 3
          assert report['publication_ready'] is False
          PY
      - name: Reject floating competitor version pins
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          plan = json.loads(Path('benchmarks/competitor-research-plan.json').read_text())
          plan['competitors'][0]['version_or_commit'] = 'latest'
          Path('build/bad-competitor-plan.json').write_text(json.dumps(plan))
          PY
          if python tools/validate_competitor_research_plan.py build/bad-competitor-plan.json 2> build/bad-competitor-plan.err; then
            echo 'floating competitor version unexpectedly accepted' >&2
            exit 1
          fi
          grep -Fqi 'requires an immutable version_or_commit' build/bad-competitor-plan.err
