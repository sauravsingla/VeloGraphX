<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="620" viewBox="0 0 1400 620" role="img" aria-labelledby="title desc">
  <title id="title">VeloGraphX dynamic analytics flow</title>
  <desc id="desc">Graph updates arrive, an affected region is identified, incremental repair is applied, and an exact result is maintained with fallback to full recomputation when needed.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#08111f"/>
      <stop offset="100%" stop-color="#111b31"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity="0.25"/>
    </filter>
  </defs>

  <rect width="1400" height="620" rx="28" fill="url(#bg)"/>
  <text x="64" y="76" fill="#f8fafc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="42" font-weight="700">VeloGraphX</text>
  <text x="64" y="116" fill="#94a3b8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24">Exact dynamic graph analytics in C++20</text>

  <g transform="translate(64,154)">
    <rect x="0" y="0" width="1272" height="86" rx="18" fill="#0f172a" stroke="#263247"/>
    <text x="28" y="38" fill="#60a5fa" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="28" font-weight="700">2,000,000 updates</text>
    <text x="28" y="66" fill="#dbeafe" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18">0 BFS mismatches · 0 triangle mismatches</text>
    <text x="410" y="50" fill="#cbd5e1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18">Adaptive repair/recompute</text>
    <text x="700" y="50" fill="#cbd5e1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18">Multicore CPU</text>
    <text x="930" y="50" fill="#cbd5e1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18">Reproducible evidence</text>
  </g>

  <g transform="translate(64,280)" font-family="Inter,Segoe UI,Arial,sans-serif" filter="url(#shadow)">
    <g>
      <rect x="0" y="0" width="270" height="230" rx="22" fill="#111827" stroke="#334155"/>
      <circle cx="34" cy="34" r="18" fill="#2563eb"/><text x="34" y="41" fill="white" text-anchor="middle" font-size="18" font-weight="700">1</text>
      <text x="66" y="41" fill="#f8fafc" font-size="22" font-weight="700">Graph updates</text>
      <text x="28" y="76" fill="#94a3b8" font-size="16">Insertions and deletions arrive.</text>
      <line x1="58" y1="130" x2="130" y2="105" stroke="#64748b" stroke-width="3"/>
      <line x1="130" y1="105" x2="205" y2="142" stroke="#64748b" stroke-width="3"/>
      <line x1="95" y1="178" x2="160" y2="160" stroke="#22c55e" stroke-width="5"/>
      <line x1="160" y1="160" x2="225" y2="188" stroke="#ef4444" stroke-width="5" stroke-dasharray="9 8"/>
      <circle cx="58" cy="130" r="9" fill="#cbd5e1"/><circle cx="130" cy="105" r="9" fill="#cbd5e1"/><circle cx="205" cy="142" r="9" fill="#cbd5e1"/>
      <circle cx="95" cy="178" r="9" fill="#22c55e"/><circle cx="160" cy="160" r="9" fill="#22c55e"/><circle cx="225" cy="188" r="9" fill="#cbd5e1"/>
    </g>

    <g transform="translate(330,0)">
      <rect x="0" y="0" width="270" height="230" rx="22" fill="#111827" stroke="#334155"/>
      <circle cx="34" cy="34" r="18" fill="#2563eb"/><text x="34" y="41" fill="white" text-anchor="middle" font-size="18" font-weight="700">2</text>
      <text x="66" y="41" fill="#f8fafc" font-size="22" font-weight="700">Affected region</text>
      <text x="28" y="76" fill="#94a3b8" font-size="16">Find only what could change.</text>
      <ellipse cx="142" cy="158" rx="88" ry="58" fill="#312e81" opacity="0.5"/>
      <line x1="72" y1="160" x2="118" y2="124" stroke="#818cf8" stroke-width="3"/>
      <line x1="118" y1="124" x2="162" y2="164" stroke="#818cf8" stroke-width="3"/>
      <line x1="162" y1="164" x2="210" y2="128" stroke="#818cf8" stroke-width="3"/>
      <line x1="118" y1="124" x2="205" y2="190" stroke="#818cf8" stroke-width="3"/>
      <circle cx="72" cy="160" r="10" fill="#60a5fa"/><circle cx="118" cy="124" r="10" fill="#60a5fa"/><circle cx="162" cy="164" r="10" fill="#60a5fa"/><circle cx="210" cy="128" r="10" fill="#60a5fa"/><circle cx="205" cy="190" r="10" fill="#60a5fa"/>
    </g>

    <g transform="translate(660,0)">
      <rect x="0" y="0" width="270" height="230" rx="22" fill="#111827" stroke="#334155"/>
      <circle cx="34" cy="34" r="18" fill="#2563eb"/><text x="34" y="41" fill="white" text-anchor="middle" font-size="18" font-weight="700">3</text>
      <text x="66" y="41" fill="#f8fafc" font-size="22" font-weight="700">Incremental repair</text>
      <text x="28" y="76" fill="#94a3b8" font-size="16">Reuse maintained state.</text>
      <path d="M66 175 C95 112, 138 205, 180 128 C198 96, 219 110, 231 140" fill="none" stroke="url(#accent)" stroke-width="6" stroke-linecap="round"/>
      <circle cx="66" cy="175" r="10" fill="#38bdf8"/><circle cx="134" cy="163" r="10" fill="#38bdf8"/><circle cx="180" cy="128" r="10" fill="#6366f1"/><circle cx="231" cy="140" r="10" fill="#6366f1"/>
      <text x="62" y="210" fill="#bfdbfe" font-size="16">Work ∝ impact, not graph size</text>
    </g>

    <g transform="translate(990,0)">
      <rect x="0" y="0" width="282" height="230" rx="22" fill="#0f1f18" stroke="#256d45"/>
      <circle cx="34" cy="34" r="18" fill="#16a34a"/><text x="34" y="41" fill="white" text-anchor="middle" font-size="18" font-weight="700">4</text>
      <text x="66" y="41" fill="#f8fafc" font-size="22" font-weight="700">Exact result</text>
      <text x="28" y="76" fill="#a7f3d0" font-size="16">Validate. Keep exactness.</text>
      <circle cx="141" cy="145" r="54" fill="#163d2b" stroke="#22c55e" stroke-width="4"/>
      <path d="M112 145 l18 18 l38 -45" fill="none" stroke="#4ade80" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="141" y="215" fill="#bbf7d0" text-anchor="middle" font-size="16">Fallback to full recompute when needed</text>
    </g>

    <text x="296" y="130" fill="#64748b" font-size="34">→</text>
    <text x="626" y="130" fill="#64748b" font-size="34">→</text>
    <text x="956" y="130" fill="#64748b" font-size="34">→</text>
  </g>

  <text x="700" y="566" fill="#bfdbfe" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="600">Update-aware · Impact-driven · Stateful · Exact</text>
  <text x="700" y="595" fill="#94a3b8" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17">Repair locally when it pays off. Recompute when it does not.</text>
</svg>